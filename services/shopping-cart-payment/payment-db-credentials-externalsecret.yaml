---
# Keep the payment runtime credentials durable across ArgoCD/ESO reconciliation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-db-credentials
  namespace: shopping-cart-payment
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: payment-db-credentials
    app.kubernetes.io/part-of: shopping-cart
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: payment-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/postgres/payment
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/postgres/payment
        property: password
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: secret/data/rabbitmq/default
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: secret/data/rabbitmq/default
        property: password
