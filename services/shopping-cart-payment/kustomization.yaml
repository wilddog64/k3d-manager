apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/wilddog64/shopping-cart-payment//k8s/base?ref=main
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: payment-service
      imagePullSecrets:
        - name: ghcr-pull-secret
    target:
      kind: ServiceAccount
      name: payment-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        template:
          spec:
            containers:
            - name: payment-service
              resources:
                requests:
                  cpu: 50m
    target:
      kind: Deployment
      name: payment-service
images:
  - name: ghcr.io/wilddog64/shopping-cart-payment
    digest: sha256:9584a11034e8a697b754d9fe0de8fb55ca09297eec583b76ad01a375689596e8
