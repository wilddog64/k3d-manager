apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/wilddog64/shopping-cart-basket//k8s/base?ref=main
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: basket-service
      imagePullSecrets:
        - name: ghcr-pull-secret
    target:
      kind: ServiceAccount
      name: basket-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: basket-service
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    target:
      kind: Deployment
      name: basket-service
