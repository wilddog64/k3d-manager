apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/wilddog64/shopping-cart-frontend//k8s/base?ref=main
  - serviceaccount.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            serviceAccountName: frontend
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    target:
      kind: Deployment
      name: frontend
images:
  - name: ghcr.io/wilddog64/shopping-cart-frontend
    digest: sha256:b721c92aa73d747c339ba51e71d8968b251659fa7a02e22ccbb337f279da5a6a
