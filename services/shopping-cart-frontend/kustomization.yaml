apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/wilddog64/shopping-cart-frontend//k8s/base?ref=main
  - serviceaccount.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            serviceAccountName: frontend
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    target:
      kind: Deployment
      name: frontend
images:
  - name: ghcr.io/wilddog64/shopping-cart-frontend
    digest: sha256:c6557ecb017a0054bcd2782db575051777bf556c3736e56d1256d120cb4c76d6
