apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/wilddog64/shopping-cart-frontend//k8s/base?ref=main
  - serviceaccount.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            serviceAccountName: frontend
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    target:
      kind: Deployment
      name: frontend
images:
  - name: ghcr.io/wilddog64/shopping-cart-frontend
    digest: sha256:1c589d0dfe0a8da37b52252d8a7f0cc89caf6df0fe940f64895d9da7d327b3e9
