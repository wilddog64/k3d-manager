apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/wilddog64/shopping-cart-frontend//k8s/base?ref=main
  - serviceaccount.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            serviceAccountName: frontend
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    target:
      kind: Deployment
      name: frontend
images:
  - name: ghcr.io/wilddog64/shopping-cart-frontend
    digest: sha256:17f46a0d6265c1baf05f8a55a8fd69bec8fab11a6b96c7600dd53d57fc691fcc
