name            = "k3dm-slack-relay"
main            = "index.js"
compatibility_date = "2024-09-23"

[vars]
WEBHOOK_URL = "https://webhook.3ai-talk.org"

# Hermes Slack approvals (docs/plans/v1.33.0-hermes-slack-approval.md §13.6).
# Operator: `wrangler kv namespace create APPROVALS_KV`, then uncomment with the returned id.
# Secrets (wrangler secret put): APPROVER_ALLOWLIST, APPROVAL_DRAIN_TOKEN (>= 32 chars).
# [[kv_namespaces]]
# binding = "APPROVALS_KV"
# id = "<namespace-id>"
