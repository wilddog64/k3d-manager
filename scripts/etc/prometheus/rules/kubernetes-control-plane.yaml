apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-control-plane-legible
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes-control-plane.legible
      interval: 60s
      rules:

        - alert: KubeAPIDown
          expr: absent(up{job="apiserver"} == 1)
          for: 15m
          labels:
            severity: critical
            cluster: hub
          annotations:
            summary: "Kubernetes API server scrape target is missing"
            description: "Prometheus has had no successful scrape of job=apiserver for 15 minutes. The API server itself may be fine — a scrape that exceeds scrape_timeout looks identical to an absent target. Check the apiserver target's last error and scrape duration before assuming an outage."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeapidown"

        - alert: KubeletDown
          expr: absent(up{job="kubelet",metrics_path="/metrics"} == 1)
          for: 15m
          labels:
            severity: critical
            cluster: hub
          annotations:
            summary: "Kubelet scrape target is missing on every node"
            description: "Prometheus has had no successful scrape of job=kubelet for 15 minutes. absent() covers all nodes at once, so this fires only when every kubelet target is gone, not when a single node drops."
            runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeletdown"
