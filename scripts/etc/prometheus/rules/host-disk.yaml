apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: host-disk
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: host.disk
      interval: 60s
      rules:
        - alert: HostDiskSpaceLow
          expr: 1 - (k3dm_disk_avail_bytes / k3dm_disk_size_bytes) > 0.80
          for: 15m
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "Host disk space is low on {{ $labels.host }}"
            description: "{{ $labels.host }} ({{ $labels.path }}) is over 80% full; investigate disk usage and retention."
        - alert: HostDiskSpaceCritical
          expr: 1 - (k3dm_disk_avail_bytes / k3dm_disk_size_bytes) > 0.90 or k3dm_disk_avail_bytes < 21474836480
          for: 10m
          labels:
            severity: critical
            cluster: hub
          annotations:
            summary: "Host disk space is critical on {{ $labels.host }}"
            description: "{{ $labels.host }} ({{ $labels.path }}) needs action: {{ if eq $labels.host \"m2\" }}run make snapshot-prune / lower K3DM_SNAPSHOT_KEEP{{ else }}docker system df; prune images{{ end }}."
        - alert: HostDiskMetricsStale
          expr: k3dm_disk_probe_success == 0 or (time() - max(push_time_seconds{job="k3dm-disk"}) > 1800) or absent(k3dm_disk_size_bytes)
          for: 30m
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "Host disk metrics are stale"
            description: "{{ $labels.host }} ({{ $labels.path }}) disk metrics are stale; check Hermes and the Pushgateway port-forward."
