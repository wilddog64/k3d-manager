apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vectordb-health
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: vectordb.health
      interval: 60s
      rules:
        - alert: VectorDBMetricsStale
          expr: >-
            absent(k3dm_vectordb_last_index_timestamp_seconds)
            or (time() - max by (job) (push_time_seconds{job="k3dm-vectordb"}) > 3600)
          for: 15m
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB metrics are absent or no longer being published"
            description: >-
              Either no VectorDB index timestamp has ever been published to Pushgateway, or the
              publisher has not pushed for over an hour. Pushgateway retains gauges after a
              publisher stops, so absent() alone cannot detect a stopped publisher — the panels
              keep showing the last values indefinitely. Check that bin/k3dm-vectordb-metrics is
              still running (the Hermes tick, or make index-docs).
        - alert: VectorDBIndexStale
          expr: time() - k3dm_vectordb_last_index_timestamp_seconds > 7 * 86400
          for: 15m
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB index is stale"
            description: "The VectorDB index has not been refreshed for more than seven days."
        - alert: VectorDBIndexDrift
          expr: sum(k3dm_vectordb_drift_docs_by_kind) > 0 and max(k3dm_vectordb_oldest_drift_age_seconds) > 7200
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB index has corpus drift"
            description: >-
              Missing documents, stale content hashes, or deleted documents remain drifted for
              more than two hours. Check the Hermes log and run make index-docs DRY_RUN=1.
        - alert: VectorDBIndexFailing
          expr: k3dm_vectordb_index_last_result{result="failed"} == 1
          for: 30m
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB automatic indexing is failing"
            description: "Hermes could not complete the latest tracked-ref indexing run."
        - alert: VectorDBRetrievalRecallBelowFloor
          expr: k3dm_vectordb_retrieval_recall_at5 < on(directory) k3dm_vectordb_retrieval_recall_floor
          for: 1h
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB retrieval recall is below its floor"
            description: "Run K3DM_RETRIEVAL_EVAL_LIVE=1 pytest scripts/tests/bin/test_find_similar_docs.py -k live."
        - alert: VectorDBRetrievalReturnsOutdatedDocs
          expr: (k3dm_vectordb_retrieval_stale_hits + k3dm_vectordb_retrieval_deleted_hits) > 0
          for: 1h
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB retrieval returned outdated documents"
            description: >-
              Run K3DM_RETRIEVAL_EVAL_LIVE=1 pytest scripts/tests/bin/test_find_similar_docs.py -k live,
              then run make index-docs DRY_RUN=1.
        - alert: VectorDBRetrievalProbeStale
          expr: time() - k3dm_vectordb_retrieval_probe_last_success_timestamp_seconds > 172800
          for: 30m
          labels:
            severity: warning
            cluster: hub
          annotations:
            summary: "VectorDB retrieval probe has not succeeded recently"
            description: "Run K3DM_RETRIEVAL_EVAL_LIVE=1 pytest scripts/tests/bin/test_find_similar_docs.py -k live."
