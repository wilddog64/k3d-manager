apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: password-bundle
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: password.bundle
      rules:
        - alert: PasswordBundleStale
          expr: time() - k3dm_password_bundle_last_publish_timestamp > 7200
          labels:
            reason: stale
            severity: warning
            cluster: hub
          annotations:
            summary: "Password bundle publication is stale"
            description: "Inspect k3dm_password_bundle_last_publish_timestamp and k3dm_password_bundle_publish_success; run make password-bundle-publish."
        - alert: PasswordBundleStale
          expr: k3dm_password_bundle_publish_success == 0
          for: 30m
          labels:
            reason: publish_failed
            severity: warning
            cluster: hub
          annotations:
            summary: "Password bundle publishing is failing"
            description: "Inspect k3dm_password_bundle_publish_success; run make password-bundle-publish."
