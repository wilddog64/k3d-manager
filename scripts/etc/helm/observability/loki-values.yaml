deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 336h
    retention_stream:
      - selector: '{job="k3dm-dispatch-run"}'
        priority: 1
        period: 720h
      - selector: '{namespace="trivy-system"}'
        priority: 1
        period: 720h
      - selector: '{namespace="cicd"}'
        priority: 1
        period: 720h
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi

write:
  enabled: false
  replicas: 0

read:
  enabled: false
  replicas: 0

backend:
  enabled: false
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false
