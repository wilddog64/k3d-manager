image:
  registry: mirror.gcr.io
  repository: aquasec/trivy-operator
  tag: "0.31.2"

trivy:
  ignoreUnfixed: true
  severity: CRITICAL,HIGH
  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 500m
  server:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

operator:
  scanJobTTL: 1h
  builtInTrivyServer: true
  vulnerabilityReportsPlugin: Trivy
  configAuditScannerEnabled: true
  resources:
    requests:
      memory: 32Mi
      cpu: 20m
    limits:
      memory: 96Mi
      cpu: 100m

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
