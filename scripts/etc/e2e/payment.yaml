---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: shopping-cart-e2e
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:16.4-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until pg_isready -h postgres -p 5432 -U postgres; do echo "waiting for postgres"; sleep 2; done
      containers:
      - name: payment
        image: shopping-cart-payment
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8084"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: payments
        - name: DB_USERNAME
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: e2e-datastore-credentials
              key: postgres-password
        - name: DB_SSLMODE
          value: disable
        - name: SPRING_CLOUD_VAULT_ENABLED
          value: "false"
        - name: OAUTH2_ENABLED
          value: "false"
        - name: RABBITMQ_VAULT_ENABLED
          value: "false"
        - name: PAYMENT_GATEWAY_DEFAULT
          value: mock
        - name: MOCK_GATEWAY_ENABLED
          value: "true"
        - name: STRIPE_ENABLED
          value: "false"
        - name: PAYPAL_ENABLED
          value: "false"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: e2e-datastore-credentials
              key: payment-encryption-key
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8084
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: payment
