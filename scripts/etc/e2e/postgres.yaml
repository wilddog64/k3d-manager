---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: datastore
    app.kubernetes.io/part-of: shopping-cart-e2e
data:
  10-create-databases.sql: |
    CREATE DATABASE products;
    CREATE DATABASE orders;
    GRANT ALL PRIVILEGES ON DATABASE products TO postgres;
    GRANT ALL PRIVILEGES ON DATABASE orders TO postgres;
  20-orders-schema.sql: |
    \connect orders
    CREATE TABLE IF NOT EXISTS orders (
        id                   UUID PRIMARY KEY,
        customer_id          VARCHAR(255)  NOT NULL,
        status               VARCHAR(255)  NOT NULL,
        total_amount         NUMERIC(10,2) NOT NULL,
        currency             VARCHAR(3)     NOT NULL,
        tracking_number      VARCHAR(255),
        carrier              VARCHAR(255),
        created_at           TIMESTAMPTZ    NOT NULL,
        updated_at           TIMESTAMPTZ,
        paid_at              TIMESTAMPTZ,
        shipped_at           TIMESTAMPTZ,
        completed_at         TIMESTAMPTZ,
        cancelled_at         TIMESTAMPTZ,
        cancellation_reason  VARCHAR(255),
        shipping_street      VARCHAR(255),
        shipping_city        VARCHAR(255),
        shipping_state       VARCHAR(255),
        shipping_postal_code VARCHAR(255),
        shipping_country     VARCHAR(255)
    );
    CREATE TABLE IF NOT EXISTS order_items (
        id            UUID PRIMARY KEY,
        order_id      UUID           NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        product_id    VARCHAR(255)   NOT NULL,
        product_name  VARCHAR(255)   NOT NULL,
        quantity      INTEGER        NOT NULL,
        unit_price    NUMERIC(10,2)  NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_orders_customer_id ON orders (customer_id);
    CREATE INDEX IF NOT EXISTS idx_order_items_order_id ON order_items (order_id);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: datastore
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: datastore
        app.kubernetes.io/part-of: shopping-cart-e2e
    spec:
      containers:
      - name: postgres
        image: postgres:16.4-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: e2e-datastore-credentials
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: data
        emptyDir: {}
      - name: initdb
        configMap:
          name: postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: datastore
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  type: ClusterIP
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
