---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket
  labels:
    app.kubernetes.io/name: basket
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: basket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: basket
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: shopping-cart-e2e
    spec:
      containers:
      - name: basket
        image: shopping-cart-basket
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: testredis123
        - name: OAUTH2_ENABLED
          value: "false"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: basket
  labels:
    app.kubernetes.io/name: basket
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8083
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: basket
