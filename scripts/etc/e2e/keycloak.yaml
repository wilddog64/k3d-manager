apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-keycloak-realm
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: shopping-cart-e2e
data:
  shopping-cart-realm.json: |
    {
      "realm": "shopping-cart",
      "enabled": true,
      "roles": {
        "realm": {
          "roles": [
            {"name": "PAYMENT_USER"},
            {"name": "PAYMENT_WRITE"}
          ]
        }
      },
      "clients": [
        {
          "clientId": "e2e-tests",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "${E2E_KC_CLIENT_SECRET}",
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": false,
          "publicClient": false,
          "protocol": "openid-connect"
        }
      ],
      "users": [
        {
          "username": "e2e-user",
          "enabled": true,
          "emailVerified": true,
          "realmRoles": ["PAYMENT_USER", "PAYMENT_WRITE"],
          "credentials": [
            {
              "type": "password",
              "value": "${E2E_KC_USER_PASSWORD}",
              "temporary": false
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: shopping-cart-e2e
    spec:
      enableServiceLinks: false
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0
        imagePullPolicy: IfNotPresent
        args:
        - start-dev
        - --import-realm
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: KC_HOSTNAME_URL
          value: http://keycloak:8080
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: E2E_KC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: e2e-keycloak-credentials
              key: client-secret
        - name: E2E_KC_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: e2e-keycloak-credentials
              key: user-password
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: realm
        configMap:
          name: e2e-keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: shopping-cart-e2e
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
