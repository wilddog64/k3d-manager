apiVersion: v1
kind: ConfigMap
metadata:
  name: k3dm-vectordb
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k3dm-vectordb.json: |
    {
      "title": "k3dm VectorDB Health",
      "uid": "k3dm-vectordb",
      "tags": ["k3dm"],
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-30d", "to": "now" },
      "panels": [
        { "id": 1, "type": "timeseries", "title": "Rows vs corpus docs (last published)", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }, "targets": [{ "expr": "k3dm_vectordb_rows", "legendFormat": "rows (last published)" }, { "expr": "k3dm_vectordb_corpus_docs", "legendFormat": "corpus docs (last published)" }] },
        { "id": 2, "type": "timeseries", "title": "Drift docs (last published)", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }, "targets": [{ "expr": "k3dm_vectordb_drift_docs", "legendFormat": "drift docs (last published)" }] },
        { "id": 3, "type": "timeseries", "title": "Index age (last published)", "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }, "targets": [{ "expr": "time() - k3dm_vectordb_last_index_timestamp_seconds", "legendFormat": "age seconds (last published)" }] },
        { "id": 4, "type": "stat", "title": "Reachability and ExternalSecret sync (last published)", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }, "targets": [{ "expr": "k3dm_vectordb_reachable", "legendFormat": "reachable (last published)" }, { "expr": "k3dm_vectordb_external_secret_synced", "legendFormat": "ExternalSecret synced (last published)" }] },
        { "id": 10, "type": "row", "title": "Ingestion", "collapsed": false, "panels": [
          { "id": 11, "type": "stat", "title": "Last run result (last published)", "targets": [{ "expr": "k3dm_vectordb_index_last_result", "legendFormat": "{{result}} (last published)" }] },
          { "id": 12, "type": "stat", "title": "Time since last successful index (last published)", "targets": [{ "expr": "time() - k3dm_vectordb_index_last_success_timestamp_seconds", "legendFormat": "age seconds (last published)" }] },
          { "id": 13, "type": "timeseries", "title": "Docs embedded / pruned per run (last published)", "targets": [{ "expr": "k3dm_vectordb_index_embedded_last", "legendFormat": "embedded (last published)" }, { "expr": "k3dm_vectordb_index_pruned_last", "legendFormat": "pruned (last published)" }] },
          { "id": 14, "type": "timeseries", "title": "Backlog (last published)", "targets": [{ "expr": "k3dm_vectordb_index_backlog_docs", "legendFormat": "backlog (last published)" }, { "expr": "k3dm_vectordb_drift_docs", "legendFormat": "drift (last published)" }] },
          { "id": 15, "type": "timeseries", "title": "Run duration (last published)", "targets": [{ "expr": "k3dm_vectordb_index_duration_seconds", "legendFormat": "duration seconds (last published)" }] },
          { "id": 16, "type": "stat", "title": "Paused on daily quota until (last published)", "targets": [{ "expr": "k3dm_vectordb_index_paused_until_timestamp_seconds", "legendFormat": "paused until (last published)" }] }
        ] }
      ]
    }
