apiVersion: v1
kind: ConfigMap
metadata:
  name: k3dm-test-metrics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k3dm-tests.json: |
    {
      "title": "k3dm Tests",
      "uid": "k3dm-tests",
      "tags": ["k3dm"],
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Last run",
          "description": "Timestamp of the latest completed suite run across published targets. This value stays fixed until another run is published. Its colour is neutral on purpose: pass or fail is shown by Latest run classification and Time since last successful run.",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "dateTimeAsIso", "color": { "mode": "fixed", "fixedColor": "text" } } },
        "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max(k3dm_test_last_timestamp_seconds) * 1000", "instant": true }]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Time since last successful run",
          "description": "Elapsed time since the latest run with zero parsed failures and Make exit code 0 across published targets.",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "yellow", "value": 86400 }, { "color": "red", "value": 259200 }
          ] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "time() - max(k3dm_test_last_success_timestamp_seconds)", "instant": true }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failed cases",
          "description": "The health signal. The make exit code is informational only. A partial run (Run complete = stopped early) counts only the stages that ran.",
          "gridPos": { "x": 0, "y": 5, "w": 8, "h": 5 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 }
          ] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "k3dm_test_cases_failed" }]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Failing test cases (latest run)",
          "description": "One current row per failed test case with its suite, case number, test name, and first diagnostic reason. No data means the latest run has no failed-case details; confirm Failed cases is 0 for a clean run.",
          "gridPos": { "x": 8, "y": 5, "w": 16, "h": 5 },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "k3dm_test_failure", "format": "table", "instant": true }],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": {
              "excludeByName": { "Time": true, "__name__": true, "instance": true, "job": true, "target": true, "Value": true },
              "renameByName": { "case": "Test case", "name": "Test name", "reason": "Failure reason", "suite": "Test suite" },
              "indexByName": { "case": 0, "name": 1, "reason": 2, "suite": 3 }
            } }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Run duration over time",
          "description": "Whole run is the wall-clock time of make test-all. Per-suite lines appear only for suites whose runner reports its own time (pytest and the unittest files); BATS reports none.",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "k3dm_test_run_duration_seconds", "legendFormat": "whole run ({{target}})" },
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "k3dm_test_suite_duration_seconds", "legendFormat": "{{suite}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Total cases",
          "description": "A sudden drop means a suite may have disappeared from collection. A partial run (Run complete = stopped early) counts only the stages that ran.",
          "gridPos": { "x": 0, "y": 26, "w": 8, "h": 8 },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "k3dm_test_cases_total" }]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Run complete",
          "description": "A run that stops at a red stage counts only the stages that ran, see OfflineSuiteRunIncomplete.",
          "gridPos": { "x": 8, "y": 26, "w": 4, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "stopped early", "color": "red" },
                    "1": { "text": "complete", "color": "green" }
                  }
                }
              ],
              "noValue": "no data"
            }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "k3dm_test_run_complete{target=\"test-all\"}",
              "instant": true
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Latest run classification",
          "description": "The current terminal run classification. passed means the publisher received exit code 0; failed_untriaged means the run failed but has not yet been confirmed as a reproducible defect. The raw Make exit code remains available as k3dm_test_exit_code.",
          "gridPos": { "x": 12, "y": 26, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "k3dm_test_run_classification", "format": "table", "instant": true }],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": {
              "excludeByName": { "Time": true, "__name__": true, "instance": true, "job": true, "Value": true },
              "renameByName": { "target": "Target", "classification": "Classification" }
            } }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Failures in selected time range",
          "description": "Retained failed-test observations from the selected dashboard time range. Repeated scrapes are deduplicated; rows identify a failure seen during the range, not an exact individual run. No data means no failed-case samples were retained in the selected range.",
          "gridPos": { "x": 0, "y": 10, "w": 24, "h": 8 },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max_over_time(k3dm_test_failure[$__range])", "format": "table", "instant": true }],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": {
              "excludeByName": { "Time": true, "__name__": true, "instance": true, "job": true, "target": true, "Value": true },
              "renameByName": { "case": "Test case", "name": "Test name", "reason": "Failure reason", "suite": "Test suite" },
              "indexByName": { "case": 0, "name": 1, "reason": 2, "suite": 3 }
            } }
          ]
        }
      ]
    }
