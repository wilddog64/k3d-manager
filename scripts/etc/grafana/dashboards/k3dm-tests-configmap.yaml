apiVersion: v1
kind: ConfigMap
metadata:
  name: k3dm-test-metrics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k3dm-tests.json: |
    {
      "title": "k3dm Tests",
      "uid": "k3dm-tests",
      "tags": ["k3dm"],
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Suite freshness",
          "description": "Seconds since the last completed suite run. Read this first because Pushgateway retains its last value indefinitely.",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "yellow", "value": 86400 }, { "color": "red", "value": 259200 }
          ] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "time() - k3dm_test_last_timestamp_seconds" }]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Last passing run",
          "description": "Seconds since the last run with zero failed cases.",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 5 },
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "yellow", "value": 86400 }, { "color": "red", "value": 259200 }
          ] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "time() - k3dm_test_last_success_timestamp_seconds" }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failed cases",
          "description": "The health signal. The make exit code is informational only.",
          "gridPos": { "x": 0, "y": 5, "w": 8, "h": 5 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 }
          ] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "k3dm_test_cases_failed" }]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Cases by suite",
          "gridPos": { "x": 8, "y": 5, "w": 16, "h": 5 },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "k3dm_test_suite_cases{result=\"not_ok\"} > 0", "format": "table" }]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Suite duration over time",
          "gridPos": { "x": 0, "y": 10, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "k3dm_test_suite_duration_seconds", "legendFormat": "{{suite}}" }]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Total cases",
          "description": "A sudden drop means a suite may have disappeared from collection.",
          "gridPos": { "x": 0, "y": 18, "w": 12, "h": 8 },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "k3dm_test_cases_total" }]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Latest test result",
          "description": "Latest recorded result for each runner. PASS is exit code 0; EXPECTED ENVIRONMENT is exit code 2 when test-pytest cannot run because pytest is unavailable; any other non-zero code is a failure.",
          "gridPos": { "x": 12, "y": 18, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "mappings": [{ "type": "value", "options": {
            "0": { "text": "PASS", "color": "green" },
            "1": { "text": "FAIL", "color": "red" },
            "2": { "text": "EXPECTED ENVIRONMENT", "color": "yellow" }
          } }] }, "overrides": [] },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "P5A1115AEDF367D43" }, "expr": "last_over_time(k3dm_test_exit_code[7d])", "format": "table", "instant": true }],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": {
              "excludeByName": { "Time": true, "__name__": true },
              "renameByName": { "Value": "Result", "instance": "Runner", "job": "Job" }
            } }
          ]
        }
      ]
    }
