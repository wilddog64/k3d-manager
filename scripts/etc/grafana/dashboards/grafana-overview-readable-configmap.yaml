---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-overview-readable
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  grafana-overview-readable.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"uid": "$datasource"},
          "description": "Prometheus alerts currently firing (the ALERTS series), excluding the always-on Watchdog and InfoInhibitor. Grafana-managed alert rules are not counted; none are defined. Open Alertmanager for the list.",
          "fieldConfig": {"defaults": {"mappings": [], "noValue": "0", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["mean"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "count(ALERTS{alertstate=\"firing\", alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)", "instant": true, "legendFormat": "Firing alerts", "refId": "A"}],
          "title": "Firing Alerts (Prometheus)",
          "type": "stat"
        },
        {
          "datasource": {"uid": "$datasource"},
          "description": "How many dashboards this Grafana instance has loaded: the provisioned ConfigMaps plus any saved in the UI. Inventory only, not a health signal. A drop after a sync means a dashboard ConfigMap stopped loading.",
          "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 80}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "id": 8,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["mean"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "sum(grafana_stat_totals_dashboard{job=~\"$job\", instance=~\"$instance\"})", "legendFormat": "Dashboards loaded", "refId": "A"}],
          "title": "Grafana Dashboards Loaded",
          "type": "stat"
        },
        {
          "datasource": {"uid": "$datasource"},
          "description": "Grafana build and runtime labels for the selected pod name.",
          "fieldConfig": {"defaults": {"custom": {"cellOptions": {"type": "auto"}}, "mappings": []}, "overrides": [{"matcher": {"id": "byName", "options": "Version"}, "properties": [{"id": "custom.width", "value": 90}]}, {"matcher": {"id": "byName", "options": "Edition"}, "properties": [{"id": "custom.width", "value": 90}]}]},
          "gridPos": {"h": 5, "w": 12, "x": 12, "y": 0},
          "id": 10,
          "options": {"showHeader": true},
          "targets": [{"expr": "grafana_build_info{job=~\"$job\", instance=~\"$instance\"}", "format": "table", "instant": true, "refId": "A"}],
          "title": "Build Info",
          "transformations": [{"id": "filterFieldsByName", "options": {"include": {"names": ["version", "edition", "pod"]}}}, {"id": "organize", "options": {"indexByName": {"version": 0, "edition": 1, "pod": 2}, "renameByName": {"version": "Version", "edition": "Edition", "pod": "Pod"}}}],
          "type": "table"
        },
        {
          "datasource": {"uid": "$datasource"},
          "description": "Request rate grouped by HTTP status code. The steady ~0.4 req/s HTTP 200 baseline is kubelet /api/health liveness and readiness probes; bursts above it are real traffic (browser sessions, dashboard provisioning reloads). Status -1 means the request did not produce a normal HTTP response, usually because instrumentation recorded an internal failure before a response was available.",
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 80}]}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "id": 2,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum by (status_code) (rate(grafana_http_request_duration_seconds_count{job=~\"$job\", instance=~\"$instance\"}[$__rate_interval]))", "legendFormat": "HTTP {{status_code}}", "refId": "A"}],
          "title": "Request Rate by HTTP Status",
          "type": "timeseries"
        },
        {
          "datasource": {"uid": "$datasource"},
          "description": "Request duration distribution. p99 means 99% of requests are faster; p50 is the median; average is the arithmetic mean.",
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 80}]}, "unit": "ms"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "id": 4,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "none"}},
          "targets": [
            {"expr": "histogram_quantile(0.99, sum(irate(grafana_http_request_duration_seconds_bucket{instance=~\"$instance\", job=~\"$job\"}[$__rate_interval])) by (le))", "legendFormat": "p99 — 99th percentile", "refId": "A"},
            {"expr": "histogram_quantile(0.50, sum(irate(grafana_http_request_duration_seconds_bucket{instance=~\"$instance\", job=~\"$job\"}[$__rate_interval])) by (le))", "legendFormat": "p50 — median", "refId": "B"},
            {"expr": "sum(irate(grafana_http_request_duration_seconds_sum{instance=~\"$instance\", job=~\"$job\"}[$__rate_interval])) / sum(irate(grafana_http_request_duration_seconds_count{instance=~\"$instance\", job=~\"$job\"}[$__rate_interval]))", "legendFormat": "Average — arithmetic mean", "refId": "C"}
          ],
          "title": "Request Latency",
          "type": "timeseries"
        },
        {
          "datasource": {"uid": "$datasource"},
          "description": "Prometheus alerts currently firing, grouped by a category derived from the alert name (Watchdog and InfoInhibitor excluded). Image vulnerabilities = Trivy CVE findings, mostly in upstream images; E2E verification = failing e2e gate; Capacity & throttling = CPU, HPA, memory, quota and volume alerts; Jobs = failed Jobs/CronJobs; Workloads = pod, deployment, statefulset, daemonset and container alerts; Monitoring stack = Prometheus, Alertmanager, Grafana and target-down alerts; Other = no category matched. Cluster hub means the alert carries no cluster label. Open Alertmanager for each alert's annotations.",
          "fieldConfig": {"defaults": {"custom": {"cellOptions": {"type": "auto"}}, "mappings": [], "noValue": "No alerts firing"}, "overrides": [{"matcher": {"id": "byName", "options": "Severity"}, "properties": [{"id": "custom.cellOptions", "value": {"type": "color-text"}}, {"id": "mappings", "value": [{"type": "value", "options": {"critical": {"color": "red", "index": 0}, "warning": {"color": "orange", "index": 1}, "info": {"color": "blue", "index": 2}}}]}]}, {"matcher": {"id": "byName", "options": "Count"}, "properties": [{"id": "custom.width", "value": 80}]}]},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 13},
          "id": 12,
          "options": {"showHeader": true, "sortBy": [{"displayName": "Count", "desc": true}]},
          "targets": [{"expr": "sort_desc(count by (category, alertname, severity, cluster) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(ALERTS{alertstate=\"firing\", alertname!~\"Watchdog|InfoInhibitor\"}, \"cluster\", \"hub\", \"cluster\", \"\"), \"category\", \"Other\", \"alertname\", \".*\"), \"category\", \"Workloads\", \"alertname\", \"KubePod.*|KubeDeployment.*|KubeStatefulSet.*|KubeDaemonSet.*|KubeContainer.*\"), \"category\", \"Capacity & throttling\", \"alertname\", \"CPUThrottling.*|KubeHpa.*|KubeCPU.*|KubeMemory.*|KubeQuota.*|KubePersistentVolume.*\"), \"category\", \"Jobs\", \"alertname\", \"KubeJob.*|KubeCronJob.*\"), \"category\", \"Monitoring stack\", \"alertname\", \"Prometheus.*|Alertmanager.*|Grafana.*|TargetDown|.*Down\"), \"category\", \"E2E verification\", \"alertname\", \"E2E.*\"), \"category\", \"Image vulnerabilities\", \"alertname\", \"Trivy.*\")))", "format": "table", "instant": true, "refId": "A"}],
          "title": "Firing Alerts by Category",
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "indexByName": {"category": 0, "alertname": 1, "severity": 2, "cluster": 3, "Value": 4}, "renameByName": {"category": "Category", "alertname": "Alert", "severity": "Severity", "cluster": "Cluster", "Value": "Count"}}}],
          "type": "table"
        }
      ],
      "schemaVersion": 41,
      "templating": {"list": [
        {"current": {"text": "Prometheus", "value": "prometheus"}, "includeAll": false, "name": "datasource", "query": "prometheus", "refresh": 1, "type": "datasource"},
        {"allValue": ".*", "datasource": "$datasource", "definition": "label_values(grafana_build_info, job)", "includeAll": true, "multi": true, "name": "job", "query": {"query": "label_values(grafana_build_info, job)", "refId": "job-variable"}, "refresh": 1, "type": "query"},
        {"allValue": ".*", "datasource": "$datasource", "definition": "label_values(grafana_build_info, instance)", "includeAll": true, "multi": true, "name": "instance", "query": {"query": "label_values(grafana_build_info, instance)", "refId": "instance-variable"}, "refresh": 1, "type": "query"}
      ]},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "utc",
      "title": "Grafana Health & Firing Alerts",
      "version": 2
    }
