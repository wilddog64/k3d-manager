apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vectordb-postgres
  namespace: vectordb
  labels:
    app.kubernetes.io/name: vectordb
    app.kubernetes.io/part-of: k3d-manager-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vectordb-postgres
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: username
      remoteRef:
        key: vectordb/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: vectordb/postgres
        property: password
