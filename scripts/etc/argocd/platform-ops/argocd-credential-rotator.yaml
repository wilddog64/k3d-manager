apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-credential-rotator
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: k3d-manager-platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-credential-rotator
  namespace: cicd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-secret"]
    verbs: ["get", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["argocd-admin-secret"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["argocd-server"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-credential-rotator
  namespace: cicd
subjects:
  - kind: ServiceAccount
    name: argocd-credential-rotator
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-credential-rotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-credential-rotator-notifier
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-ops-notifications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-credential-rotator-notifier
subjects:
  - kind: ServiceAccount
    name: argocd-credential-rotator
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-credential-rotator-notifier
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-credential-rotator
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: k3d-manager-platform-ops
spec:
  schedule: "0 0 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: argocd-credential-rotator
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: argocd-credential-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: docker.io/alpine/k8s:1.31.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -eu
                  vault_addr="http://vault.secrets.svc:8200"
                  jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  login="$(curl -fsS -X POST "$vault_addr/v1/auth/kubernetes/login" -d "$(jq -nc --arg role argocd-rotation --arg jwt "$jwt" '{role:$role,jwt:$jwt}')")"
                  token="$(printf '%s' "$login" | jq -er '.auth.client_token')"
                  vault_hdr="$(mktemp)"
                  printf 'X-Vault-Token: %s\n' "$token" > "$vault_hdr"
                  old_password="$(curl -fsS --header "@$vault_hdr" "$vault_addr/v1/secret/data/argocd/admin" | jq -er '.data.data.password')"
                  old_bcrypt="$(kubectl -n cicd get secret argocd-secret -o jsonpath='{.data.admin\.password}' | base64 --decode)"
                  old_mtime="$(kubectl -n cicd get secret argocd-secret -o jsonpath='{.data.admin\.passwordMtime}' | base64 --decode || true)"
                  new="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                  new_bcrypt="$(printf '%s\n' "$new" | kubectl exec -i -n cicd deploy/argocd-server -- argocd account bcrypt | sed 's/^Password: //')"
                  mtime="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  restore() {
                    kubectl -n cicd patch secret argocd-secret --type merge \
                      -p "$(jq -nc --arg p "$old_bcrypt" --arg m "$old_mtime" '{stringData:{"admin.password":$p,"admin.passwordMtime":$m}}')" >/dev/null || true
                    curl -fsS -X PUT --header "@$vault_hdr" -H 'Content-Type: application/json' \
                      -d "$(jq -nc --arg username admin --arg password "$old_password" '{data:{username:$username,password:$password}}')" \
                      "$vault_addr/v1/secret/data/argocd/admin" >/dev/null || true
                    kubectl -n cicd get externalsecret argocd-admin-secret >/dev/null 2>&1 \
                      && kubectl -n cicd annotate externalsecret argocd-admin-secret force-sync="$(date +%s)" --overwrite >/dev/null 2>&1 || true
                  }
                  trap restore EXIT
                  curl -fsS -X PUT --header "@$vault_hdr" -H 'Content-Type: application/json' \
                    -d "$(jq -nc --arg username admin --arg password "$new" '{data:{username:$username,password:$password}}')" \
                    "$vault_addr/v1/secret/data/argocd/admin" >/dev/null
                  kubectl -n cicd patch secret argocd-secret --type merge \
                    -p "$(jq -nc --arg p "$new_bcrypt" --arg m "$mtime" '{stringData:{"admin.password":$p,"admin.passwordMtime":$m}}')" >/dev/null
                  kubectl -n cicd get externalsecret argocd-admin-secret >/dev/null 2>&1 \
                    && kubectl -n cicd annotate externalsecret argocd-admin-secret force-sync="$(date +%s)" --overwrite >/dev/null 2>&1 || true
                  slack_url="$(kubectl get secret platform-ops-notifications -n platform-ops -o jsonpath='{.data.slack-incoming-webhook-url}' 2>/dev/null | base64 --decode || true)"
                  if [ -n "$slack_url" ]; then
                    curl -fsS --max-time 10 -X POST "$slack_url" -H 'Content-Type: application/json' \
                      -d '{"text":"🔐 Monthly service password rotation completed: ArgoCD. Password values are not included."}' >/dev/null || true
                  fi
                  trap - EXIT
                  rm -f "$vault_hdr"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
