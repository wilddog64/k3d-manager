apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-credential-rotator
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: k3d-manager-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-credential-rotator
  namespace: monitoring
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["grafana-admin-credentials"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kube-prometheus-stack-grafana"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-credential-rotator
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: grafana-credential-rotator
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-credential-rotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-credential-rotator-notifier
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-ops-notifications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-credential-rotator-notifier
subjects:
  - kind: ServiceAccount
    name: grafana-credential-rotator
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-credential-rotator-notifier
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-credential-rotator
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: k3d-manager-observability
spec:
  schedule: "0 0 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-credential-rotator
        spec:
          serviceAccountName: grafana-credential-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: docker.io/alpine/k8s:1.31.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -eu
                  vault_addr="http://vault.secrets.svc:8200"
                  jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  login="$(curl -fsS -X POST "$vault_addr/v1/auth/kubernetes/login" -d "$(jq -nc --arg role grafana-rotation --arg jwt "$jwt" '{role:$role,jwt:$jwt}')")"
                  token="$(printf '%s' "$login" | jq -er '.auth.client_token')"
                  old="$(curl -fsS -H "X-Vault-Token: $token" "$vault_addr/v1/secret/data/observability/grafana" | jq -er '.data.data.password')"
                  new="$(openssl rand -hex 24)"
                  restore() {
                    curl -fsS -X PUT -H "X-Vault-Token: $token" -H 'Content-Type: application/json' \
                      -d "$(jq -nc --arg username admin --arg password "$old" '{data:{username:$username,password:$password}}')" \
                      "$vault_addr/v1/secret/data/observability/grafana" >/dev/null || true
                    kubectl annotate externalsecret grafana-admin-credentials -n monitoring force-sync="$(date +%s)" --overwrite >/dev/null 2>&1 || true
                  }
                  trap restore EXIT
                  curl -fsS -X PUT -H "X-Vault-Token: $token" -H 'Content-Type: application/json' \
                    -d "$(jq -nc --arg username admin --arg password "$new" '{data:{username:$username,password:$password}}')" \
                    "$vault_addr/v1/secret/data/observability/grafana" >/dev/null
                  kubectl annotate externalsecret grafana-admin-credentials -n monitoring force-sync="$(date +%s)" --overwrite >/dev/null
                  kubectl rollout restart deployment/kube-prometheus-stack-grafana -n monitoring >/dev/null
                  kubectl rollout status deployment/kube-prometheus-stack-grafana -n monitoring --timeout=5m >/dev/null
                  slack_url="$(kubectl get secret platform-ops-notifications -n platform-ops -o jsonpath='{.data.slack-incoming-webhook-url}' 2>/dev/null | base64 -d || true)"
                  if [ -n "$slack_url" ]; then
                    curl -fsS --max-time 10 -X POST "$slack_url" -H 'Content-Type: application/json' \
                      -d '{"text":"🔐 Monthly service password rotation completed: Grafana. Password values are not included."}' >/dev/null || true
                  fi
                  trap - EXIT
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
