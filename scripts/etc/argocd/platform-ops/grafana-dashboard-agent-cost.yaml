apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-cost
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-cost.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Cost",
      "uid": "k3dm-agent-cost",
      "description": "Agent cost and Claude usage panels by selected time window or release.",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "k3dm-agents"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "title": "Agents"
        },
        {
          "type": "link",
          "title": "Bug Tracking",
          "url": "/d/k3dm-bugs"
        }
      ],
      "tags": [
        "k3d-manager",
        "k3dm-agents"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "window",
            "label": "Window",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k3dm_dispatch_landed, window)",
              "refId": "window"
            },
            "definition": "label_values(k3dm_dispatch_landed, window)",
            "refresh": 2,
            "sort": 7,
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "7d",
              "value": "7d",
              "selected": true
            }
          }
        ]
      },
      "panels": [
        {
          "id": 19,
          "type": "row",
          "title": "Cost (API-equivalent)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 20,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Codex at API prices",
          "description": "API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_api_cost_usd{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 21,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Per landed spec",
          "description": "All Codex usage in scope, including refused and abandoned attempts, divided by landed specs. Landed means the tests and scope gate passed, not a live proof. API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_api_cost_per_landed_usd{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 22,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Cached input",
          "description": "API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_cached_input_ratio{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Subscriptions / month",
          "description": "The per-plan split is available from subscription_usd_per_month; only the ChatGPT plan pays for Codex. API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(k3dm_dispatch_subscription_usd_per_month)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 24,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Ledger coverage",
          "description": "time windows only; shows no data for a release. The second target shows estimated unledgered API-equivalent cost. API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_codex_sessions{window=\"$window\",ledgered=\"true\"} / ignoring(ledgered) sum without(ledgered) (k3dm_dispatch_codex_sessions{window=\"$window\"})",
              "instant": true,
              "legendFormat": "in the ledger"
            },
            {
              "expr": "k3dm_dispatch_unledgered_api_cost_usd{window=\"$window\"}",
              "instant": true,
              "legendFormat": "outside the ledger"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "outside the ledger"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyUSD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 25,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Projected / month",
          "description": "Codex usage at API prices over the last 7 days (or since the ledger's first session, if newer), by session start time, scaled to 30 days. What this workload would cost on pay-per-token billing. Codex and Claude. Gemini is not instrumented. API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_api_cost_usd{window=\"7d\"} / k3dm_dispatch_api_cost_observed_days{window=\"7d\"} * 30 + k3dm_dispatch_claude_api_cost_usd{window=\"7d\"} / k3dm_dispatch_claude_api_cost_observed_days{window=\"7d\"} * 30",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 27,
          "type": "bargauge",
          "title": "By model",
          "description": "API-equivalent: Codex session tokens, cached input included, priced at scripts/etc/agent/codex-model-prices.json (checked 2026-10-23). Not a bill. Codex runs on the $20/month ChatGPT plan.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_api_cost_by_model_usd{window=\"$window\"}",
              "instant": true,
              "legendFormat": "{{model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "basic"
          }
        },
        {
          "id": 28,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude at API prices",
          "description": "Claude Code usage priced at Anthropic API list rates; not the subscription bill. A time window counts every message in it, including spec writing, design and discussion. A release counts only messages sent while one of its specs was between dispatch and land, split across specs that overlap. Attribution is by time overlap: it does not measure what Claude spent on any one Codex dispatch, because Claude's activity in that time can include spec writing, design, discussion and other work.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_claude_api_cost_usd{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 29,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude per landed spec",
          "description": "Release scope only; time windows show no data, because their total is all Claude work, not only dispatch work. Claude at API prices divided by the release's landed specs. Attribution is by time overlap: it does not measure what Claude spent on any one Codex dispatch, because Claude's activity in that time can include spec writing, design, discussion and other work.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_claude_api_cost_per_landed_usd{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "noValue": "Release window only"
            },
            "overrides": []
          }
        },
        {
          "id": 30,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude data since",
          "description": "Earliest retained Claude usage record.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_claude_coverage_start_timestamp_seconds * 1000",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeFromNow",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 31,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude tokens per landed spec",
          "description": "Release scope only; time windows show no data. All Claude tokens in scope, including cache reads, divided by the release's landed specs; same scope as Claude per landed spec. Attribution is by time overlap: it does not measure what Claude spent on any one Codex dispatch, because Claude's activity in that time can include spec writing, design, discussion and other work.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_claude_tokens_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "noValue": "Release window only"
            },
            "overrides": []
          }
        },
        {
          "id": 32,
          "type": "barchart",
          "title": "Claude tokens per day",
          "description": "Last 30 days, all Claude sessions in this repo including subagents, all token kinds including cache reads. Ignores the Spec window.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (date, model) (k3dm_dispatch_claude_daily_tokens)",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "groupingToMatrix",
              "options": {
                "rowField": "date",
                "columnField": "model",
                "valueField": "Value"
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "date\\model": "date"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "xField": "date",
            "stacking": "normal",
            "text": {
              "valueSize": 14
            }
          }
        },
        {
          "id": 34,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude cost per verified spec",
          "description": "Claude API-equivalent cost in the selected time window divided by distinct docs newly closed or transitioned from open to closed in the window, across all verification levels. Shows No data when the count is 0.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (window) (k3dm_dispatch_claude_api_cost_usd{window=\"$window\"}) / (sum by (window) (k3dm_claude_verified_specs{window=\"$window\"}) > 0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 86,
          "type": "bargauge",
          "title": "Claude tokens by kind",
          "description": "All Claude tokens in the selected window or release, split by kind across every model. cache_read is a prompt-cache hit, billed at a small fraction of the input rate; cache_write is a cache fill (5m and 1h combined), billed above the input rate; input is uncached input. Token volume is therefore not proportional to cost.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (kind) (k3dm_dispatch_claude_tokens{window=\"$window\"})",
              "instant": true,
              "legendFormat": "{{kind}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "namePlacement": "left",
            "displayMode": "basic",
            "showUnfilled": true,
            "minVizHeight": 8,
            "text": {
              "titleSize": 14,
              "valueSize": 20
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 87,
          "type": "barchart",
          "title": "Claude tokens per day by kind",
          "description": "Last 30 days, all Claude sessions in this repo including subagents, split into input, cache_write, cache_read and output. Cache reads are billed at a fraction of the input rate.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (date, kind) (k3dm_dispatch_claude_daily_tokens_by_kind)",
              "instant": true,
              "format": "table",
              "legendFormat": "{{kind}}"
            }
          ],
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "groupingToMatrix",
              "options": {
                "rowField": "date",
                "columnField": "kind",
                "valueField": "Value"
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "date\\kind": "date"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "xField": "date",
            "stacking": "normal",
            "text": {
              "valueSize": 14
            }
          }
        },
        {
          "id": 88,
          "type": "bargauge",
          "title": "Claude cost by kind",
          "description": "Claude API-equivalent cost in the selected window or release, split into input, cache_write, cache_read and output. Cache reads are billed at a fraction of the input rate.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_claude_api_cost_by_kind_usd{window=\"$window\"}",
              "instant": true,
              "legendFormat": "{{kind}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "min": 0,
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "namePlacement": "left",
            "displayMode": "basic",
            "showUnfilled": true,
            "minVizHeight": 8,
            "text": {
              "titleSize": 14,
              "valueSize": 20
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 93,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude cost per live-verified resolution",
          "description": "Claude API-equivalent cost in the selected time window divided by distinct docs newly marked LIVE-VERIFIED in the window. Shows No data when the count is 0.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (window) (k3dm_dispatch_claude_api_cost_usd{window=\"$window\"}) / (sum by (window) (k3dm_claude_verified_specs{window=\"$window\",level=\"live\"}) > 0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 94,
          "type": "row",
          "title": "Whole system at API prices",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 43},
          "panels": []
        },
        {
          "id": 95,
          "type": "stat",
          "title": "Claude + Codex at API prices",
          "description": "Sum of Claude, ledgered Codex and unledgered Codex usage in the selected window, with no denominator. Uses list API prices; includes failed dispatches, rework and review.",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 44},
