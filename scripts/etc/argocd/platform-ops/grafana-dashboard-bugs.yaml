apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bugs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  k3dm-bugs.json: |
    {
      "title": "k3dm Bug Tracking",
      "uid": "k3dm-bugs",
      "links": [
        {
          "type": "link",
          "title": "Agent dispatch",
          "url": "/d/k3dm-agent-dispatch"
        }
      ],
      "tags": [
        "k3dm"
      ],
      "schemaVersion": 38,
      "version": 5,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
      },
      "templating": {
        "list": [
          {
            "name": "repo",
            "label": "Repo",
            "type": "custom",
            "query": "k3d-manager,lib-foundation",
            "options": [],
            "multi": false,
            "includeAll": false,
            "current": {"selected": true, "text": "k3d-manager", "value": "k3d-manager"},
            "hide": 0
          },
          {
            "name": "release_mode",
            "label": "Release mode",
            "type": "custom",
            "query": "Auto (current) : 1,Manual : 0",
            "options": [],
            "multi": false,
            "includeAll": false,
            "current": {"selected": true, "text": "Auto (current)", "value": "1"},
            "hide": 0
          },
          {
            "name": "release",
            "label": "Manual releases (ignored in Auto)",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values({__name__=~\"k3dm_bug_info|k3dm_plan_release_docs\",repo=\"$repo\"}, release_order)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "definition": "label_values({__name__=~\"k3dm_bug_info|k3dm_plan_release_docs\",repo=\"$repo\"}, release_order)",
            "regex": "/^\\S+ (?<value>\\S+)$/",
            "refresh": 2,
            "sort": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {"selected": true, "text": ["v1.43.6"], "value": ["v1.43.6"]},
            "hide": 0
          },
          {
            "name": "verified",
            "label": "Verified fixes",
            "type": "custom",
            "query": "Hide live-verified : ^(false|-)?$,Show all : .*",
            "options": [],
            "multi": false,
            "includeAll": false,
            "current": {"selected": true, "text": "Show all", "value": ".*"},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 20,
          "type": "row",
          "title": "Release",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Release",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(k3dm_bug_current_release_info{repo=\"$repo\"} and on() (vector($release_mode) == 1)) or (label_replace(vector(1), \"release\", \"${release:text}\", \"\", \"\") and on() (vector($release_mode) == 0))",
              "instant": true,
              "legendFormat": "{{release}}"
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "name"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "description": "Follows Release mode: Auto shows the current release; Manual shows the picked releases as the Manual releases box names them (All when All is picked). Bug docs count toward a release by their **Branch:** line, else the first tag that contains them.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Bugs filed",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((k3dm_bug_release_docs{repo=\"$repo\"} and on(release,repo) k3dm_bug_current_release_info{repo=\"$repo\"} and on() (vector($release_mode) == 1)) or (k3dm_bug_release_docs{repo=\"$repo\",release=~\"$release\"} and on() (vector($release_mode) == 0))) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Bugs open",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((k3dm_bug_status_docs{repo=\"$repo\",status=~\"open|unknown\"} and on(release,repo) k3dm_bug_current_release_info{repo=\"$repo\"} and on() (vector($release_mode) == 1)) or (k3dm_bug_status_docs{repo=\"$repo\",status=~\"open|unknown\",release=~\"$release\"} and on() (vector($release_mode) == 0))) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Bugs fixed",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((k3dm_bug_fixed_in_release_docs{repo=\"$repo\"} and on(release,repo) k3dm_bug_current_release_info{repo=\"$repo\"} and on() (vector($release_mode) == 1)) or (k3dm_bug_fixed_in_release_docs{repo=\"$repo\",release=~\"$release\"} and on() (vector($release_mode) == 0))) or vector(0)",
              "instant": true
            }
          ],
          "description": "Bugs whose status became fixed on this release, whenever they were filed.\nBugs with no detectable fix commit are not counted here; see the table's Fixed in = unknown.",
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Open, scheduled later",
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_later_release_open_docs{repo=\"$repo\"})",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "description": "Repository-wide count of open bug docs whose **Branch:** line names a release after the current one (for example a patch release); it does not follow Release mode.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Open, untriaged",
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_docs{repo=\"$repo\",state=~\"open|unknown\",priority=\"unset\"})",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "description": "Repository-wide count of open or unclear docs with no **Priority:** line. Should stay 0; it does not follow Release mode.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 21,
          "type": "row",
          "title": "Last five releases and the current one",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 7,
          "type": "barchart",
          "title": "Bugs filed per release, by priority",
          "description": "Every bug doc counted toward each release. unset = filed before priorities existed (2026-10-09). Hover a bar for every count.",
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 8,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (release, order, priority) (k3dm_bug_release_docs{repo=\"$repo\"}) > 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "order"
                  }
                ]
              }
            },
            {
              "id": "groupingToMatrix",
              "options": {
                "rowField": "release",
                "columnField": "priority",
                "valueField": "Value",
                "emptyValue": "null"
              }
            },
            {
              "id": "renameByRegex",
              "options": {
                "regex": "release\\\\priority",
                "renamePattern": "release"
              }
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "release": 0,
                  "P0": 1,
                  "P1": 2,
                  "P2": 3,
                  "P3": 4,
                  "unset": 5
                }
              }
            }
          ],
          "options": {
            "xField": "release",
            "stacking": "normal",
            "showValue": "never",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "xTickLabelRotation": 0,
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 80
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "P0"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P1"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P2"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P3"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unset"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8e8e8e"
                    }
                  }
                ]
              }
            ]
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 8,
          "type": "barchart",
          "title": "Bugs filed per release, open vs fixed",
          "description": "closed = FIXED, RESOLVED, CLOSED or similar; unknown = no recognisable status line. Hover a bar for every count.",
          "gridPos": {
            "x": 8,
            "y": 37,
            "w": 8,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (release, order, state) (k3dm_bug_release_docs{repo=\"$repo\"}) > 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "order"
                  }
                ]
              }
            },
            {
              "id": "groupingToMatrix",
              "options": {
                "rowField": "release",
                "columnField": "state",
                "valueField": "Value",
                "emptyValue": "null"
              }
            },
            {
              "id": "renameByRegex",
              "options": {
                "regex": "release\\\\state",
                "renamePattern": "release"
              }
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "release": 0,
                  "closed": 1,
                  "open": 2,
                  "unknown": 3
                }
              }
            }
          ],
          "options": {
            "xField": "release",
            "stacking": "normal",
            "showValue": "never",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "xTickLabelRotation": 0,
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 80
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "closed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "open"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unknown"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8e8e8e"
                    }
                  }
                ]
              }
            ]
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 25,
          "type": "barchart",
          "title": "Bugs fixed per release, by priority",
          "description": "Counted by the release whose commits changed the bug's status to fixed. A bug filed in one release and fixed in a later one counts here under the later one.",
          "gridPos": {
            "x": 16,
            "y": 37,
            "w": 8,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (release, order, priority) (k3dm_bug_fixed_in_release_docs{repo=\"$repo\"}) > 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "sortBy",
              "options": {"sort": [{"field": "order"}]}
            },
            {
              "id": "groupingToMatrix",
              "options": {"rowField": "release", "columnField": "priority", "valueField": "Value", "emptyValue": "null"}
            },
            {
              "id": "renameByRegex",
              "options": {"regex": "release\\\\priority", "renamePattern": "release"}
            },
            {
              "id": "organize",
              "options": {"indexByName": {"release": 0, "P0": 1, "P1": 2, "P2": 3, "P3": 4, "unset": 5}}
            }
          ],
          "options": {
            "xField": "release",
            "stacking": "normal",
            "showValue": "never",
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
            "xTickLabelRotation": 0,
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "custom": {"fillOpacity": 80}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "P0"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}]},
              {"matcher": {"id": "byName", "options": "P1"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]},
              {"matcher": {"id": "byName", "options": "P2"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "P3"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "yellow"}}]},
              {"matcher": {"id": "byName", "options": "unset"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "#8e8e8e"}}]}
            ]
          },
          "datasource": {"type": "prometheus", "uid": "prometheus"}
        },
        {
          "id": 22,
          "type": "row",
          "title": "Filed-in bug summaries",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 46,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Open P0",
          "gridPos": {"x": 0, "y": 47, "w": 2, "h": 3},
          "targets": [
            {
              "refId": "A",
              "expr": "sum((((k3dm_bug_status_docs{repo=\"$repo\",status=\"open\",priority=\"P0\"} and on(repo,release) k3dm_bug_current_release_info{repo=\"$repo\"})) and on() (vector($release_mode) == 1)) or ((k3dm_bug_status_docs{repo=\"$repo\",status=\"open\",priority=\"P0\",release=~\"$release\"}) and on() (vector($release_mode) == 0))) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Open P1",
          "gridPos": {"x": 2, "y": 47, "w": 2, "h": 3},
          "targets": [
            {
              "refId": "A",
              "expr": "sum((((k3dm_bug_status_docs{repo=\"$repo\",status=\"open\",priority=\"P1\"} and on(repo,release) k3dm_bug_current_release_info{repo=\"$repo\"})) and on() (vector($release_mode) == 1)) or ((k3dm_bug_status_docs{repo=\"$repo\",status=\"open\",priority=\"P1\",release=~\"$release\"}) and on() (vector($release_mode) == 0))) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Open P2",
          "gridPos": {"x": 4, "y": 47, "w": 2, "h": 3},
          "targets": [
            {
              "refId": "A",
              "expr": "sum((((k3dm_bug_status_docs{repo=\"$repo\",status=\"open\",priority=\"P2\"} and on(repo,release) k3dm_bug_current_release_info{repo=\"$repo\"})) and on() (vector($release_mode) == 1)) or ((k3dm_bug_status_docs{repo=\"$repo\",status=\"open\",priority=\"P2\",release=~\"$release\"}) and on() (vector($release_mode) == 0))) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Open P3",
          "gridPos": {"x": 6, "y": 47, "w": 2, "h": 3},
          "targets": [
