apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bugs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  k3dm-bugs.json: |
    {
      "title": "k3dm Bug Tracking",
      "uid": "k3dm-bugs",
      "tags": [
        "k3dm"
      ],
      "schemaVersion": 38,
      "version": 5,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
      },
      "panels": [
        {
          "id": 20,
          "type": "row",
          "title": "Current release",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Release",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "k3dm_bug_current_release_info",
              "instant": true,
              "legendFormat": "{{release}}"
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "name"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "description": "The release branch Hermes indexes. Bug docs count toward it by their **Branch:** line, else the first tag that contains them.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Filed this release",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_release_docs and on(release) k3dm_bug_current_release_info)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Open this release",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_release_docs{state=\"open\"} and on(release) k3dm_bug_current_release_info)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Fixed this release",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_release_docs{state=\"closed\"} and on(release) k3dm_bug_current_release_info)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Open, scheduled later",
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_later_release_open_docs)",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "description": "Open bug docs whose **Branch:** line names a release after the current one (for example a patch release).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Open, untriaged",
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k3dm_bug_docs{state=~\"open|unknown\",priority=\"unset\"})",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "description": "Open or unclear docs with no **Priority:** line. Should stay 0.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 21,
          "type": "row",
          "title": "Last five releases and the current one",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 7,
          "type": "barchart",
          "title": "Bugs filed per release, by priority",
          "description": "Every bug doc counted toward each release. unset = filed before priorities existed (2026-10-09).",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (release, order, priority) (k3dm_bug_release_docs) > 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "order"
                  }
                ]
              }
            },
            {
              "id": "groupingToMatrix",
              "options": {
                "rowField": "release",
                "columnField": "priority",
                "valueField": "Value",
                "emptyValue": "null"
              }
            },
            {
              "id": "renameByRegex",
              "options": {
                "regex": "release\\\\priority",
                "renamePattern": "release"
              }
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "release": 0,
                  "P0": 1,
                  "P1": 2,
                  "P2": 3,
                  "P3": 4,
                  "unset": 5
                }
              }
            }
          ],
          "options": {
            "xField": "release",
            "stacking": "normal",
            "showValue": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "xTickLabelRotation": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 80
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "P0"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P1"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P2"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "P3"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unset"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8e8e8e"
                    }
                  }
                ]
              }
            ]
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "id": 8,
          "type": "barchart",
          "title": "Bugs per release, open vs fixed",
          "description": "closed = FIXED, RESOLVED, CLOSED or similar; unknown = no recognisable status line.",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (release, order, state) (k3dm_bug_release_docs) > 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "sortBy",
