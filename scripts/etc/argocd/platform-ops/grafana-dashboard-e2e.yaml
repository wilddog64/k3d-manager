apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-e2e
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  e2e.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "title": "E2E Verification",
      "uid": "e2e-verification",
      "tags": ["e2e", "verification", "shopping-cart", "vcluster"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(e2e_run_info, exported_service)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "tier",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(e2e_run_info, tier)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "runner",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(e2e_run_info, runner)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "mappings": [ { "type": "value", "options": { "0": { "text": "FAIL", "color": "red" }, "1": { "text": "PASS", "color": "green" } } } ], "thresholds": { "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "e2e_last_run_pass{exported_service=~\"$service\",tier=~\"$tier\",runner=~\"$runner\"}", "legendFormat": "{{runner}}: {{tier}}/{{exported_service}}/{{project}}", "instant": true, "refId": "A" } ],
          "title": "Status by runner/service/tier/project",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 86400 }, { "color": "red", "value": 259200 } ] } }, "overrides": [] },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "time() - e2e_last_success_timestamp_seconds{exported_service=~\"$service\",tier=~\"$tier\",runner=~\"$runner\"}", "legendFormat": "{{runner}}: {{tier}}/{{exported_service}}/{{project}}", "instant": true, "refId": "A" } ],
          "title": "Last success age",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "count(e2e_run_info{passed=\"false\",exported_service=~\"$service\",tier=~\"$tier\",runner=~\"$runner\"}) or vector(0)", "instant": true, "refId": "A" } ],
          "title": "Failing runs in window",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "always" } }, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "id": 4,
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last"] }, "tooltip": { "mode": "multi" } },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "e2e_last_run_duration_seconds{exported_service=~\"$service\",tier=~\"$tier\",runner=~\"$runner\"}", "legendFormat": "{{runner}}: {{tier}}/{{exported_service}}/{{project}}", "refId": "A" } ],
          "title": "Duration trend",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "filterable": true } }, "overrides": [] },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 14 },
          "id": 5,
          "options": { "showHeader": true },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "e2e_run_info{exported_service=~\"$service\",tier=~\"$tier\",runner=~\"$runner\"}", "format": "table", "instant": true, "refId": "A" } ],
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true, "Value": true, "__name__": true, "job": true, "instance": true, "container": true, "endpoint": true, "namespace": true, "pod": true, "service": true, "service_label": true }, "indexByName": {}, "renameByName": { "exported_service": "Service", "run_id": "Run ID", "candidate_digest": "Candidate digest", "passed": "Passed", "failed": "Failed", "total": "Total", "duration_seconds": "Duration (s)", "timestamp": "Timestamp", "commit": "Commit", "project": "Project", "tier": "Tier", "runner": "Runner" } } } ],
          "title": "Recent runs",
          "type": "table"
        }
      ]
    }
