apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: k3dm-analyze
  namespace: cicd
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: k3dm-analyze
    matchers:
      - name: alertname
        value: ArgoCDAppDegraded|ArgoCDAppOutOfSync|ArgoCDImageUpdaterFlapping|TrivyOperatorScanJobFailures|TrivyCriticalVulnerabilityDetected
        matchType: "=~"
    routes:
      - receiver: k3dm-cve-remediate
        matchers:
          - name: remediation
            value: cve-auto-patch
            matchType: "="
        groupBy: ["namespace", "image_repository"]
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 24h
        continue: true
      - receiver: k3dm-analyze
        matchers:
          - name: remediation
            value: cve-auto-patch
            matchType: "="
        groupBy: ["namespace", "image_repository"]
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 12h
  inhibitRules:
    - sourceMatch:
        - name: alertname
          value: CVERemediationInFlight
          matchType: "="
      targetMatch:
        - name: alertname
          value: TrivyCriticalVulnerabilityDetected
          matchType: "="
      equal: ["image_repository"]
  receivers:
    - name: k3dm-analyze
      webhookConfigs:
        - url: "https://webhook.3ai-talk.org/api/v1/analyze"
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: k3dm-webhook-token
                key: token
    - name: k3dm-cve-remediate
      webhookConfigs:
        - url: "https://webhook.3ai-talk.org/api/v1/cve-remediate"
          sendResolved: false
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: k3dm-webhook-token
                key: token
