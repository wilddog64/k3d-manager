apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vectordb
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  k3dm-vectordb.json: |
    {
      "title": "k3dm VectorDB Health",
      "uid": "k3dm-vectordb",
      "tags": ["k3dm"],
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-30d", "to": "now" },
      "panels": [
        { "id": 1, "type": "timeseries", "title": "Rows vs corpus docs (last published)", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }, "targets": [{ "expr": "k3dm_vectordb_rows", "legendFormat": "rows (last published)" }, { "expr": "k3dm_vectordb_corpus_docs", "legendFormat": "corpus docs (last published)" }] },
        { "id": 2, "type": "timeseries", "title": "Drift docs (last published)", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }, "targets": [{ "expr": "k3dm_vectordb_drift_docs", "legendFormat": "drift docs (last published)" }] },
        { "id": 3, "type": "timeseries", "title": "Index age (last published)", "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }, "targets": [{ "expr": "time() - k3dm_vectordb_last_index_timestamp_seconds", "legendFormat": "age seconds (last published)" }] },
        { "id": 4, "type": "stat", "title": "Reachability and ExternalSecret sync (last published)", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }, "targets": [{ "expr": "k3dm_vectordb_reachable", "legendFormat": "reachable (last published)" }, { "expr": "k3dm_vectordb_external_secret_synced", "legendFormat": "ExternalSecret synced (last published)" }] },
        {"id": 10, "type": "row", "title": "Ingestion", "collapsed": false, "gridPos": {"x": 0, "y": 16, "w": 24, "h": 1}, "panels": []},
        {"id": 11, "type": "stat", "title": "Last run result (last published)", "gridPos": {"x": 0, "y": 17, "w": 8, "h": 6}, "options": {"textMode": "name", "colorMode": "background", "graphMode": "none"}, "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "success"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]}, {"matcher": {"id": "byName", "options": "noop"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]}, {"matcher": {"id": "byName", "options": "paused"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]}, {"matcher": {"id": "byName", "options": "failed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}]}, "targets": [{"expr": "k3dm_vectordb_index_last_result == 1", "instant": true, "range": false, "legendFormat": "{{result}}"}]},
        {"id": 12, "type": "stat", "title": "Time since last successful index (last published)", "gridPos": {"x": 8, "y": 17, "w": 8, "h": 6}, "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 3600}, {"color": "red", "value": 21600}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none"}, "targets": [{"expr": "time() - k3dm_vectordb_index_last_success_timestamp_seconds", "instant": true, "range": false, "legendFormat": "age (last published)"}]},
        {"id": 16, "type": "stat", "title": "Paused on daily quota until (last published)", "gridPos": {"x": 16, "y": 17, "w": 8, "h": 6}, "fieldConfig": {"defaults": {"unit": "dateTimeAsIso", "mappings": [{"type": "value", "options": {"0": {"text": "not paused"}}}]}, "overrides": []}, "options": {"colorMode": "none", "graphMode": "none"}, "targets": [{"expr": "k3dm_vectordb_index_paused_until_timestamp_seconds * 1000", "instant": true, "range": false, "legendFormat": "paused until (last published)"}]},
        {"id": 13, "type": "timeseries", "title": "Docs embedded (API) / from cache / pruned per run (last published)", "gridPos": {"x": 0, "y": 23, "w": 8, "h": 8}, "targets": [{"expr": "k3dm_vectordb_index_embedded_last", "legendFormat": "embedded via API (last published)"}, {"expr": "k3dm_vectordb_index_from_cache_last", "legendFormat": "from cache (last published)"}, {"expr": "k3dm_vectordb_index_pruned_last", "legendFormat": "pruned (last published)"}]},
        {"id": 14, "type": "timeseries", "title": "Backlog (last published)", "gridPos": {"x": 8, "y": 23, "w": 8, "h": 8}, "targets": [{"expr": "k3dm_vectordb_index_backlog_docs", "legendFormat": "backlog (last published)"}, {"expr": "k3dm_vectordb_drift_docs", "legendFormat": "drift (last published)"}]},
        {"id": 15, "type": "timeseries", "title": "Run duration (last published)", "gridPos": {"x": 16, "y": 23, "w": 8, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "targets": [{"expr": "k3dm_vectordb_index_duration_seconds", "legendFormat": "duration (last published)"}]}
      ]
    }
