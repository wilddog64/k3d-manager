apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-activity
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-activity.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Activity",
      "uid": "k3dm-agent-activity",
      "description": "Codex and agy activity and quota measurements across time windows only.",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "k3dm-agents"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "title": "Agents"
        },
        {
          "type": "link",
          "title": "Bug Tracking",
          "url": "/d/k3dm-bugs"
        }
      ],
      "tags": [
        "k3d-manager",
        "k3dm-agents"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "window",
            "label": "Window",
            "type": "custom",
            "query": "1d,7d,30d",
            "options": [
              {
                "text": "1d",
                "value": "1d",
                "selected": false
              },
              {
                "text": "7d",
                "value": "7d",
                "selected": true
              },
              {
                "text": "30d",
                "value": "30d",
                "selected": false
              }
            ],
            "current": {
              "text": "7d",
              "value": "7d",
              "selected": true
            },
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 33,
          "type": "row",
          "title": "Claude context and compaction",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 35,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Compactions per verified spec",
          "description": "Compaction boundaries in the selected time window divided by verified specs in the window.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(k3dm_claude_compactions{window=\"$window\"}) / sum(k3dm_claude_verified_specs{window=\"$window\"} > 0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 36,
          "type": "bargauge",
          "title": "Compactions by trigger",
          "description": "Compaction boundaries in the selected time window split by trigger (auto or manual).",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_claude_compactions{window=\"$window\"}",
              "instant": true,
              "legendFormat": "{{trigger}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "basic",
            "orientation": "horizontal",
            "namePlacement": "left",
            "minVizHeight": 8,
            "text": {
              "titleSize": 14,
              "valueSize": 24
            }
          }
        },
        {
          "id": 37,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Re-read share after compaction",
          "description": "Share of file reads in the selected window that first re-read a file after a compaction boundary in the same session.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_claude_reads{window=\"$window\",kind=\"reread_after_compaction\"} / ignoring(kind) (k3dm_claude_reads{window=\"$window\",kind=\"all\"} > 0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 38,
          "type": "bargauge",
          "title": "Context incidents",
          "description": "Hand-tallied resumption failures and missing-context corrections in the selected time window from docs/metrics/context-window-experiment.md.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_claude_context_incidents{window=\"$window\"}",
              "instant": true,
              "legendFormat": "{{kind}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "basic",
            "orientation": "horizontal",
            "namePlacement": "left",
            "minVizHeight": 8,
            "text": {
              "titleSize": 14,
              "valueSize": 24
            }
          }
        },
        {
          "id": 39,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Auto-compact setting (configured)",
          "description": "Latest non-future auto_compact_tokens setting from docs/metrics/context-window-experiment.md. It may not take effect: a setting above the session context window is ignored.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_claude_auto_compact_tokens",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 99,
          "type": "stat",
          "title": "Observed compaction point",
          "description": "Mean context size at automatic compactions in the selected window, from transcript compactMetadata.preTokens; this is the threshold that actually applied.",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 1},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "k3dm_claude_compaction_pre_tokens_sum{window=\"$window\",trigger=\"auto\"} / k3dm_claude_compactions{window=\"$window\",trigger=\"auto\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No auto-compactions in window",
              "mappings": [
                {"type": "special", "options": {"match": "nan", "result": {"text": "No auto-compactions in window"}}},
                {"type": "special", "options": {"match": "null", "result": {"text": "No auto-compactions in window"}}}
              ],
              "color": {"mode": "fixed", "fixedColor": "blue"}
            },
            "overrides": []
          },
          "options": {"text": {"valueSize": 32}}
        },
        {
          "id": 100,
          "type": "stat",
          "title": "Wasted re-read share",
          "description": "Share of reads that re-read content identical to the pre-compaction read.",
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 13},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "k3dm_claude_reads{window=\"$window\",kind=\"reread_unchanged\"} / ignoring(kind) (k3dm_claude_reads{window=\"$window\",kind=\"all\"} > 0)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "color": {"mode": "fixed", "fixedColor": "blue"}, "noValue": "No reads in window", "mappings": [
            {"type": "special", "options": {"match": "nan", "result": {"text": "No reads in window"}}},
            {"type": "special", "options": {"match": "null", "result": {"text": "No reads in window"}}}
          ]}, "overrides": []},
          "options": {"text": {"valueSize": 32}}
        },
        {
          "id": 49,
          "type": "row",
          "title": "All Codex activity (including outside the dispatcher)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 19
