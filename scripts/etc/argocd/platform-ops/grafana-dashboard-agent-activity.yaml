apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-activity
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-activity.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Activity",
      "uid": "k3dm-agent-activity",
      "description": "Codex and agy activity and quota measurements across time windows only.",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "k3dm-agents"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "title": "Agents"
        },
        {
          "type": "link",
          "title": "Bug Tracking",
          "url": "/d/k3dm-bugs"
        }
      ],
      "tags": [
        "k3d-manager",
        "k3dm-agents"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "window",
            "label": "Window",
            "type": "custom",
            "query": "1d,7d,30d",
            "options": [
              {
                "text": "1d",
                "value": "1d",
                "selected": false
              },
              {
                "text": "7d",
                "value": "7d",
                "selected": true
              },
              {
                "text": "30d",
                "value": "30d",
                "selected": false
              }
            ],
            "current": {
              "text": "7d",
              "value": "7d",
              "selected": true
            },
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 33,
          "type": "row",
          "title": "Claude context and compaction",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 35,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Compactions per verified spec",
          "description": "Compaction boundaries in the selected time window divided by verified specs in the window.",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(k3dm_claude_compactions{window=\"$window\"}) / sum(k3dm_claude_verified_specs{window=\"$window\"} > 0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 36,
          "type": "bargauge",
          "title": "Compactions by trigger",
          "description": "Compaction boundaries in the selected time window split by trigger (auto or manual).",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_claude_compactions{window=\"$window\"}",
              "instant": true,
              "legendFormat": "{{trigger}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "basic"
