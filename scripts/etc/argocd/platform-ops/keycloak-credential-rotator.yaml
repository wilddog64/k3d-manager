apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-credential-rotator
  namespace: identity
  labels:
    app.kubernetes.io/part-of: k3d-manager-platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keycloak-credential-rotator-notifier
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["platform-ops-notifications"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-credential-rotator-notifier
subjects:
  - kind: ServiceAccount
    name: keycloak-credential-rotator
    namespace: identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keycloak-credential-rotator-notifier
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-credential-rotator
  namespace: identity
  labels:
    app.kubernetes.io/part-of: k3d-manager-platform-ops
spec:
  schedule: "0 0 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-credential-rotator
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: keycloak-credential-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: docker.io/alpine/k8s:1.31.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -eu
                  vault_addr="http://vault.secrets.svc:8200"
                  keycloak_addr="http://keycloak.identity.svc"
                  admin_user="${KEYCLOAK_ADMIN_USERNAME:-admin}"
                  jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  login="$(curl -fsS -X POST "$vault_addr/v1/auth/kubernetes/login" -d "$(jq -nc --arg role keycloak-rotation --arg jwt "$jwt" '{role:$role,jwt:$jwt}')")"
                  token="$(printf '%s' "$login" | jq -er '.auth.client_token')"
                  admin_secret="$(curl -fsS -H "X-Vault-Token: $token" "$vault_addr/v1/secret/data/keycloak/admin")"
                  old_admin="$(printf '%s' "$admin_secret" | jq -er '.data.data.admin_password')"
                  old_db="$(printf '%s' "$admin_secret" | jq -er '.data.data.db_password')"
                  [ -n "$old_admin" ]
                  [ -n "$old_db" ]
                  new="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                  token_body="$(jq -nr --arg username "$admin_user" --arg password "$old_admin" '"grant_type=password&client_id=admin-cli&username=" + ($username|@uri) + "&password=" + ($password|@uri)')"
                  old_token="$(printf '%s' "$token_body" | curl -fsS -X POST "$keycloak_addr/realms/master/protocol/openid-connect/token" -H 'Content-Type: application/x-www-form-urlencoded' --data @- | jq -er '.access_token')"
                  user_id="$(curl -fsS -H "Authorization: Bearer $old_token" "$keycloak_addr/admin/realms/master/users?username=$(printf '%s' "$admin_user" | jq -sRr @uri)&exact=true" | jq -er '.[0].id')"
                  trap rollback EXIT
                  rollback_needed=0
                  rollback() {
                    if [ "$rollback_needed" -eq 1 ]; then
                      rollback_failed=0
                      rollback_body="$(jq -nr --arg username "$admin_user" --arg password "$new" '"grant_type=password&client_id=admin-cli&username=" + ($username|@uri) + "&password=" + ($password|@uri)')"
                      rollback_token="$(printf '%s' "$rollback_body" | curl -fsS -X POST "$keycloak_addr/realms/master/protocol/openid-connect/token" -H 'Content-Type: application/x-www-form-urlencoded' --data @- | jq -er '.access_token')" || rollback_failed=1
                      if [ "$rollback_failed" -eq 0 ]; then
                        jq -nc --arg password "$old_admin" '{type:"password",value:$password,temporary:false}' | curl -fsS -X PUT -H "Authorization: Bearer $rollback_token" -H 'Content-Type: application/json' --data @- "$keycloak_addr/admin/realms/master/users/$user_id/reset-password" >/dev/null || rollback_failed=1
                      fi
                      jq -nc --arg admin_password "$old_admin" --arg db_password "$old_db" '{data:{admin_password:$admin_password,db_password:$db_password}}' | curl -fsS -X PUT -H "X-Vault-Token: $token" -H 'Content-Type: application/json' --data @- "$vault_addr/v1/secret/data/keycloak/admin" >/dev/null || true
                      if [ "$rollback_failed" -ne 0 ]; then
                        slack_url="$(kubectl get secret platform-ops-notifications -n platform-ops -o jsonpath='{.data.slack-incoming-webhook-url}' 2>/dev/null | base64 -d || true)"
                        if [ -n "$slack_url" ]; then
                          curl -fsS --max-time 10 -X POST "$slack_url" -H 'Content-Type: application/json' -d '{"text":"🚨 Keycloak credential rotation rollback failed; credential is in an unknown state. Vault path: secret/keycloak/admin. No credential values are included."}' >/dev/null || true
                        fi
                        trap - EXIT
                        exit 1
                      fi
                    fi
                  }
                  jq -nc --arg password "$new" '{type:"password",value:$password,temporary:false}' | curl -fsS -X PUT -H "Authorization: Bearer $old_token" -H 'Content-Type: application/json' --data @- "$keycloak_addr/admin/realms/master/users/$user_id/reset-password" >/dev/null
                  rollback_needed=1
                  jq -nc --arg admin_password "$new" --arg db_password "$old_db" '{data:{admin_password:$admin_password,db_password:$db_password}}' | curl -fsS -X PUT -H "X-Vault-Token: $token" -H 'Content-Type: application/json' --data @- "$vault_addr/v1/secret/data/keycloak/admin" >/dev/null
                  verify_body="$(jq -nr --arg username "$admin_user" --arg password "$new" '"grant_type=password&client_id=admin-cli&username=" + ($username|@uri) + "&password=" + ($password|@uri)')"
                  printf '%s' "$verify_body" | curl -fsS -X POST "$keycloak_addr/realms/master/protocol/openid-connect/token" -H 'Content-Type: application/x-www-form-urlencoded' --data @- | jq -er '.access_token' >/dev/null
                  trap - EXIT
                  slack_url="$(kubectl get secret platform-ops-notifications -n platform-ops -o jsonpath='{.data.slack-incoming-webhook-url}' 2>/dev/null | base64 -d || true)"
                  if [ -n "$slack_url" ]; then
                    curl -fsS --max-time 10 -X POST "$slack_url" -H 'Content-Type: application/json' -d '{"text":"🔐 Monthly service password rotation completed: Keycloak. The db_password was preserved; the ArgoCD-managed ExternalSecret was not force-synced and will converge on its 15m refresh interval. Password values are not included."}' >/dev/null || true
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
