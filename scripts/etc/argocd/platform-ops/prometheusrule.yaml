apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-degraded
  namespace: cicd
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: argocd.alerts
      rules:
        - alert: ArgoCDAppDegraded
          expr: |
            argocd_app_info{
              name=~"shopping-cart-(apps|basket|frontend|identity|namespace|networking|order|payment|product-catalog|rules)|data-layer|trivy-operator|ubuntu-hostinger-(eso|platform)",
              health_status="Degraded"
            } == 1
          for: 5m
          labels:
            group: argocd
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: "App {{ $labels.name }} in namespace {{ $labels.dest_namespace }} has been Degraded for 5 minutes"
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{
              name=~"shopping-cart-(apps|basket|frontend|identity|namespace|networking|order|payment|product-catalog|rules)|data-layer|trivy-operator|ubuntu-hostinger-(eso|platform)",
              sync_status="OutOfSync"
            } == 1
          for: 15m
          labels:
            group: argocd
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
            description: "App {{ $labels.name }} in namespace {{ $labels.dest_namespace }} has been OutOfSync for 15 minutes"
        - alert: ArgoCDImageUpdaterFlapping
          expr: |
            max by (name) (
              increase(argocd_app_sync_total{
                name=~"shopping-cart-(basket|order|product-catalog)"
              }[30m])
            ) >= 5
          for: 10m
          labels:
            group: image-updater
            severity: warning
          annotations:
            summary: "ArgoCD Image Updater is flapping on {{ $labels.name }}"
            description: "App {{ $labels.name }} has synced at least 5 times in the last 30 minutes, which usually means Image Updater is writing a change that another controller keeps reverting"
    - name: trivy-operator.alerts
      rules:
        - alert: TrivyOperatorScanJobFailures
          expr: |
            sum(increase(kube_job_status_failed{namespace="trivy-system",job_name=~"scan-.*"}[10m])) > 0
          for: 5m
          labels:
            group: trivy-operator
            severity: warning
          annotations:
            summary: "Trivy Operator scan jobs are failing"
            description: "At least one Trivy Operator scan job in namespace trivy-system has failed within the last 10 minutes"
        # Only images we build (wilddog64/*) can be auto-remediated by the
        # event-driven app-cve-scan loop, so only those carry the
        # remediation=cve-auto-patch label that routes to the remediate/analyze
        # webhooks. Upstream/third-party images are split into a separate rule
        # below that routes quietly (dashboard-only) — otherwise every upstream
        # CVE floods Slack with a non-actionable "will attempt promotion/rebuild"
        # notification. namespace is NOT a usable discriminator here: the
        # exporter attributes every image to platform-ops.
        - alert: TrivyCriticalVulnerabilityDetected
          expr: |
            sum by (cluster, namespace, image_repository) (
              trivy_vulnerability_inventory{severity="CRITICAL", image_repository=~"wilddog64/.*"}
            ) > 0
          for: 15m
          labels:
            severity: critical
            group: trivy-operator
            remediation: cve-auto-patch
            # The notification webhook historically renders .Labels.app. Keep
            # that field populated from the canonical image label so alerts do
            # not arrive as "app ''" when no workload app label exists.
            app: "{{ $labels.image_repository }}"
          annotations:
            summary: "Critical CVE(s) detected in a running image"
            description: "{{ $value }} critical vulnerabilities in {{ $labels.image_repository }} (ns {{ $labels.namespace }}); event-driven app-cve-scan will attempt promotion/rebuild."
        - alert: TrivyCriticalVulnerabilityDetected
          expr: |
            sum by (cluster, namespace, image_repository) (
              trivy_vulnerability_inventory{severity="CRITICAL", image_repository!="", image_repository!~"wilddog64/.*"}
            ) > 0
          for: 15m
          labels:
            severity: warning
            group: trivy-operator
            remediation: none
            tier: upstream
            app: "{{ $labels.image_repository }}"
          annotations:
            summary: "Critical CVE(s) in an upstream image (not auto-remediable)"
            description: "{{ $value }} critical vulnerabilities in third-party image {{ $labels.image_repository }} (ns {{ $labels.namespace }}); visible in the CVE inventory dashboard. No auto-patch — track upstream."
        - alert: CVERemediationInFlight
          expr: |
            max by (image_repository) (
              label_replace(
                cve_remediation_state{state="promotion_requested", image_repository!=""},
                "image_repository", "$1", "image_repository", "(?:[^/]+/)?([^/]+/[^/]+)"
              )
            ) == 1
          for: 0m
          labels:
            group: cve-remediation
            severity: none
          annotations:
            summary: "CVE auto-patch in flight for {{ $labels.image_repository }}"
            description: "An auto-patch promotion is in flight for {{ $labels.image_repository }}; TrivyCriticalVulnerabilityDetected for this image is inhibited until the promotion completes."
    - name: e2e.alerts
      rules:
        - alert: E2EVerificationFailing
          expr: e2e_last_run_pass == 0
          for: 10m
          labels:
            group: e2e
            severity: warning
            tier: e2e
          annotations:
            summary: "e2e {{ $labels.project }} failing on {{ $labels.tier }} for {{ $labels.service }}"
            description: "The most recent e2e run for {{ $labels.service }}/{{ $labels.project }} on the {{ $labels.tier }} substrate failed and has stayed red for 10 minutes."
        - alert: E2EVerificationStale
          expr: time() - e2e_last_success_timestamp_seconds > 259200
          for: 30m
          labels:
            group: e2e
            severity: warning
            tier: e2e
          annotations:
            summary: "no passing e2e for {{ $labels.service }}/{{ $labels.tier }} in >3d"
            description: "No passing e2e run for {{ $labels.service }} on the {{ $labels.tier }} substrate in over 3 days; the verification signal is stale."
