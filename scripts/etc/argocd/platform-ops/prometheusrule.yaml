apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-degraded
  namespace: cicd
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: argocd.alerts
      rules:
        - alert: ArgoCDAppDegraded
          expr: |
            argocd_app_info{
              name=~"shopping-cart-(apps|basket|frontend|identity|namespace|networking|order|payment|product-catalog|rules)|data-layer|trivy-operator|ubuntu-hostinger-(eso|platform)",
              health_status="Degraded"
            } == 1
          for: 5m
          labels:
            group: argocd
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: "App {{ $labels.name }} in namespace {{ $labels.dest_namespace }} has been Degraded for 5 minutes"
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{
              name=~"shopping-cart-(apps|basket|frontend|identity|namespace|networking|order|payment|product-catalog|rules)|data-layer|trivy-operator|ubuntu-hostinger-(eso|platform)",
              sync_status="OutOfSync"
            } == 1
          for: 15m
          labels:
            group: argocd
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is OutOfSync"
            description: "App {{ $labels.name }} in namespace {{ $labels.dest_namespace }} has been OutOfSync for 15 minutes"
        - alert: ArgoCDImageUpdaterFlapping
          expr: |
            max by (name) (
              increase(argocd_app_sync_total{
                name=~"shopping-cart-(basket|order|product-catalog)"
              }[30m])
            ) >= 5
          for: 10m
          labels:
            group: image-updater
            severity: warning
          annotations:
            summary: "ArgoCD Image Updater is flapping on {{ $labels.name }}"
            description: "App {{ $labels.name }} has synced at least 5 times in the last 30 minutes, which usually means Image Updater is writing a change that another controller keeps reverting"
    - name: trivy-operator.alerts
      rules:
        - alert: TrivyOperatorScanJobFailures
          expr: |
            sum(increase(kube_job_status_failed{namespace="trivy-system",job_name=~"scan-.*"}[10m])) > 0
          for: 5m
          labels:
            group: trivy-operator
            severity: warning
          annotations:
            summary: "Trivy Operator scan jobs are failing"
            description: "At least one Trivy Operator scan job in namespace trivy-system has failed within the last 10 minutes"
        - alert: TrivyCriticalVulnerabilityDetected
          expr: |
            sum by (namespace, image_repository) (
              trivy_image_vulnerabilities{severity="Critical"}
            ) > 0
          for: 15m
          labels:
            severity: critical
            group: trivy-operator
            remediation: cve-auto-patch
          annotations:
            summary: "Critical CVE(s) detected in a running image"
            description: "{{ $value }} Critical vulnerabilit(y/ies) in {{ $labels.image_repository }} (ns {{ $labels.namespace }}); event-driven app-cve-scan will attempt promotion/rebuild."
