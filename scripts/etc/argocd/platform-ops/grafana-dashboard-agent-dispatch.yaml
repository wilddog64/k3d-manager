apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-dispatch
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-dispatch.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Dispatch",
      "uid": "k3dm-agent-dispatch",
      "description": "Codex dispatch throughput, landing outcomes, intervention and agent efficiency.",
      "tags": ["k3d-manager", "codex", "dispatch"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-30d", "to": "now"},
      "templating": {"list": [{
        "name": "window", "label": "Spec window", "type": "custom",
        "description": "Which ledger window the panels show. The Grafana time picker does not change these panels; only this control does.",
        "query": "1d,7d,30d", "options": [
          {"text": "1d", "value": "1d", "selected": false},
          {"text": "7d", "value": "7d", "selected": false},
          {"text": "30d", "value": "30d", "selected": true}
        ], "current": {"text": "30d", "value": "30d", "selected": true}
      }]},
      "panels": [
        {"id": 1, "type": "stat", "title": "Accepted specs", "description": "Landed tasks in the selected window.", "gridPos": {"h": 6, "w": 5, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 2, "type": "stat", "title": "Landing success", "description": "Integration-test success: scope and rebase refusals are not counted because they are not integration results.", "gridPos": {"h": 6, "w": 5, "x": 5, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(k3dm_dispatch_land_attempts{window=\"$window\",result=\"landed\"}) / sum(k3dm_dispatch_land_attempts{window=\"$window\",result=~\"landed|tests\"})", "instant": true}], "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 0.8}]}}, "overrides": []}},
        {"id": 3, "type": "stat", "title": "Claude lines changed per task", "description": "Added plus deleted lines between Codex's finished tree and what landed; this measures intervention, not active time.", "gridPos": {"h": 6, "w": 5, "x": 10, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_verifier_lines_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 4, "type": "stat", "title": "Wait minutes per task", "description": "Wall-clock waiting time from Codex exit to land, not Claude's active minutes.", "gridPos": {"h": 6, "w": 5, "x": 15, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_wait_minutes_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "minutes"}, "overrides": []}},
        {"id": 5, "type": "stat", "title": "Codex tokens per accepted spec", "description": "Codex tokens only; Claude's verification tokens are not recorded per task and tokens are not converted to dollars because price per token is not stable. A mean; one long spec can dominate it — see Per spec.", "gridPos": {"h": 6, "w": 5, "x": 0, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_codex_tokens_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}},
        {"id": 6, "type": "stat", "title": "Running", "description": "Started tasks with no Codex exit, land, or abandon event.", "gridPos": {"h": 6, "w": 5, "x": 5, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_running", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 7, "type": "stat", "title": "Awaiting land", "description": "Tasks with a Codex exit and no land or abandon event.", "gridPos": {"h": 6, "w": 5, "x": 10, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_awaiting_land", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 8, "type": "bargauge", "title": "Land outcomes", "description": "Land outcomes by result in the selected window.", "gridPos": {"h": 6, "w": 5, "x": 15, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_land_attempts{window=\"$window\"}", "legendFormat": "{{result}}"}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 10, "type": "stat", "title": "Minutes to land per spec", "description": "Mean wall-clock time from a spec's first Codex start to its land, including Claude's verification.", "gridPos": {"h": 6, "w": 4, "x": 20, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_elapsed_minutes_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "m"}, "overrides": []}},
        {"id": 11, "type": "stat", "title": "Codex minutes per spec", "description": "Mean time Codex itself ran per spec, summed over its runs.", "gridPos": {"h": 6, "w": 4, "x": 20, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_codex_minutes_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "m"}, "overrides": []}},
        {"id": 12, "type": "table", "title": "Per spec", "description": "Each landed spec in the window, newest 50. Codex tokens are the session total of the spec's last run. Only specs dispatched with `bin/k3dm-codex-dispatch` appear; a bare `codex exec` writes no ledger event.", "gridPos": {"h": 10, "w": 19, "x": 5, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (version, slug) (k3dm_dispatch_task_codex_tokens{window=\"$window\"})", "format": "table", "instant": true, "refId": "A"}, {"expr": "sum by (version, slug) (k3dm_dispatch_task_codex_seconds{window=\"$window\"})", "format": "table", "instant": true, "refId": "B"}, {"expr": "sum by (version, slug) (k3dm_dispatch_task_elapsed_seconds{window=\"$window\"})", "format": "table", "instant": true, "refId": "C"}, {"expr": "sum by (version, slug) (k3dm_dispatch_task_runs{window=\"$window\"})", "format": "table", "instant": true, "refId": "D"}], "transformations": [{"id": "merge"}, {"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"version": "Release", "slug": "Spec", "Value #A": "Codex tokens", "Value #B": "Codex time", "Value #C": "Time to land", "Value #D": "Codex runs"}}}], "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "Codex tokens"}, "properties": [{"id": "unit", "value": "short"}]}, {"matcher": {"id": "byName", "options": "Codex time"}, "properties": [{"id": "unit", "value": "s"}]}, {"matcher": {"id": "byName", "options": "Time to land"}, "properties": [{"id": "unit", "value": "s"}]}]}, "options": {"sortBy": [{"displayName": "Codex tokens", "desc": true}]}},
        {"id": 9, "type": "stat", "title": "Time since last dispatch update", "description": "Time since bin/k3dm-dispatch-metrics last published the ledger. It runs after every bin/k3dm-codex-dispatch event (start, exit, land, resume, abandon) or make dispatch-metrics, so a large value means no wrapped dispatch since, not a broken exporter. Yellow above one day.", "gridPos": {"h": 6, "w": 5, "x": 0, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "time() - k3dm_dispatch_ledger_timestamp_seconds", "instant": true}], "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "yellow", "value": 86400}]}}, "overrides": []}},
        {"id": 13, "type": "stat", "title": "Rework rate", "description": "Share of landed specs that needed a second pass: Codex ran more than once, the integration gate refused it for tests, or Claude changed lines before landing. Rebase and scope refusals are not rework. The independent verifier's verdict is not in the ledger, so it counts only through the re-run or edit that followed. Split by cause: k3dm_dispatch_rework_landed.", "gridPos": {"h": 4, "w": 5, "x": 0, "y": 18}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_rework_ratio{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "yellow", "value": 0.5}]}}, "overrides": []}}
      ]
    }
