apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-dispatch
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-dispatch.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Dispatch",
      "uid": "k3dm-agent-dispatch",
      "description": "Codex dispatch throughput, landing outcomes, intervention and agent efficiency across the selected window or release. Release scope covers v1.43.0 onward; earlier releases were dispatched before the ledger existed.",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "k3dm-agents"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "title": "Agents"
        },
        {
          "type": "link",
          "title": "Bug Tracking",
          "url": "/d/k3dm-bugs"
        }
      ],
      "tags": [
        "k3d-manager",
        "k3dm-agents"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "window",
            "label": "Window",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k3dm_dispatch_landed, window)",
              "refId": "window"
            },
            "definition": "label_values(k3dm_dispatch_landed, window)",
            "refresh": 2,
            "sort": 7,
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "7d",
              "value": "7d",
              "selected": true
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Accepted specs",
          "description": "Landed tasks in the selected window.",
          "gridPos": {
            "h": 6,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Landing success",
          "description": "Integration-test success: scope and rebase refusals are not counted because they are not integration results.",
          "gridPos": {
            "h": 6,
            "w": 3,
            "x": 3,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(k3dm_dispatch_land_attempts{window=\"$window\",result=\"landed\"}) / sum(k3dm_dispatch_land_attempts{window=\"$window\",result=~\"landed|tests\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 0.8
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude lines changed per task",
          "description": "Added plus deleted lines between Codex's finished tree and what landed; this measures intervention, not active time.",
          "gridPos": {
            "h": 6,
            "w": 3,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_verifier_lines_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Wait minutes per task",
          "description": "Wall-clock waiting time from Codex exit to land, not Claude's active minutes.",
          "gridPos": {
            "h": 6,
            "w": 3,
            "x": 9,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_wait_minutes_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "minutes",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Codex tokens / spec",
          "description": "Codex tokens only; Claude verification tokens are not recorded per task. See Cost (API-equivalent) for dollars. A mean; one long spec can dominate it — see Per spec.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_codex_tokens_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Running",
          "description": "Started tasks with no Codex exit, land, or abandon event. (not release-scoped)",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 5,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_running",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Awaiting land",
          "description": "Tasks with a Codex exit and no land or abandon event. (not release-scoped)",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 10,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_awaiting_land",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Land outcomes",
          "description": "Land outcomes by result in the selected window.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 15,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_land_attempts{window=\"$window\"}",
              "legendFormat": "{{result}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "landed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "rebase"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "scope"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "tests"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "displayMode": "basic"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Time to land",
          "description": "Mean per spec. Earliest start.ts → land.ts, including retries, idle time, overnight waits and verification. This is total wall-clock elapsed, not worker execution or active review; live verification happens after land.",
          "gridPos": {
            "h": 6,
            "w": 3,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_elapsed_minutes_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "stat",
          "options": {"text": {"valueSize": 32}},
          "title": "Release span",
          "description": "Calendar time from the release's first dispatch to its PR merge, or to its last land while unmerged. Pick a release in Window; a time window such as 7d has no release span.",
          "gridPos": {"h": 6, "w": 3, "x": 15, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "k3dm_dispatch_release_span_minutes{window=\"$window\"}", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "m", "noValue": "pick a release", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []}
        },
        {
          "id": 15,
          "type": "stat",
          "options": {"text": {"valueSize": 32}},
          "title": "Active time",
          "description": "Time at least one spec was in flight, with overlapping spec intervals counted once.",
          "gridPos": {"h": 6, "w": 3, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "k3dm_dispatch_release_active_minutes{window=\"$window\"}", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "m", "noValue": "pick a release", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []}
        },
        {
          "id": 11,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Codex time",
          "description": "Mean worker execution time, summed over Codex runs. It excludes idle time between worker exit and landing.",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 20,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_codex_minutes_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Per spec",
          "description": "Each landed spec in the selected window or release, newest 50. Agent time is worker execution; Dispatch → land (dispatch-to-land elapsed, wall clock) is earliest start.ts → land.ts including retries, idle time and overnight waits; Exit → land (final worker exit → land) is the wall-clock gap from the last qualifying Codex exit to land, not proven human wait or active review. N/A means exit timing is unavailable. Live verification occurs after landing and is not included. Human continuation prompts are explicitly recorded operator events only; the denominator is tasks in intervention tracking coverage, not a claim that all human effort is measured. API equiv. stays Codex-only because agy pricing is unavailable. Worker and Coordinator show reported identity evidence. Repo is the origin repository. Claude ≈ is Claude's intervention cost, not coordinator attribution. Release scope covers v1.43.0 onward. Only specs dispatched with `bin/k3dm-codex-dispatch` appear; a bare `codex exec` writes no ledger event. The footer totals Tokens, Agent time, Runs and API equiv. over the rows shown; elapsed columns are not totalled, because their means are the stats above.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 12},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_agent_tokens{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_agent_seconds{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_elapsed_seconds{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "C"
            },
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_post_exit_land_seconds{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "J"
            },
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_agent_runs{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "D"
            },
            {
              "expr": "max by (version, slug, spec, agent, repo) (k3dm_dispatch_task_spec{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "E"
            },
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_api_cost_usd{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "F"
            },
            {
              "expr": "sum by (version, slug, repo) (k3dm_dispatch_task_claude_api_cost_usd{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "G"
            },
            {
              "expr": "max by (version, slug, repo, worker) (label_join(k3dm_dispatch_model_identity{window=\"$window\",role=\"worker\",model!=\"unknown\"}, \"worker\", \" \", \"vendor\", \"model\", \"status\"))",
              "format": "table",
              "instant": true,
              "refId": "H"
            },
            {
              "expr": "max by (version, slug, repo, coordinator) (label_join(k3dm_dispatch_model_identity{window=\"$window\",role=\"coordinator\",model!=\"unknown\"}, \"coordinator\", \" \", \"vendor\", \"model\", \"status\"))",
              "format": "table",
              "instant": true,
              "refId": "I"
            }
          ],
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #E": true,
                  "Value #H": true,
                  "Value #I": true
                },
                "indexByName": {
                  "version": 0,
                  "slug": 1,
                  "repo": 2,
                  "agent": 3,
                  "Value #A": 4,
                  "Value #B": 5,
                  "Value #C": 6,
                  "Value #J": 7,
                  "Value #D": 8,
                  "Value #F": 9,
                  "Value #G": 10,
                  "worker": 11,
                  "coordinator": 12,
                  "spec": 13
                },
                "renameByName": {
                  "version": "Release",
                  "slug": "Spec",
                  "repo": "Repo",
                  "agent": "Agent",
                  "Value #A": "Tokens",
                  "Value #B": "Agent time",
                  "Value #C": "Dispatch → land",
                  "Value #J": "Exit → land",
                  "Value #D": "Runs",
                  "Value #F": "API equiv.",
                  "Value #G": "Claude ≈",
                  "worker": "Worker",
                  "coordinator": "Coordinator"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {"custom": {"minWidth": 80}},
            "overrides": [
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Release"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 70
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Spec"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 170
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Repo"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 105
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Agent"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 70
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Tokens"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 85
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Agent time"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 95
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Dispatch → land"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 125
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Exit → land"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 110
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Runs"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 60
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "API equiv."
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 90
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Claude ≈"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 85
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Worker"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 110
                   }
                 ]
               },
               {
                 "matcher": {
                   "id": "byName",
                   "options": "Coordinator"
                 },
                 "properties": [
                   {
                     "id": "custom.width",
                     "value": 120
                   }
                 ]
               },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Tokens"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Agent time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Dispatch → land"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Exit → land"},
                "properties": [
                  {"id": "unit", "value": "s"},
                  {"id": "description", "value": "Wall-clock interval from the final valid Codex exit at or before land to land. N/A when no qualifying exit is available; this is not proof of human waiting or active review."}
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Release"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open this release in Bug Tracking",
                        "url": "/d/k3dm-bugs?var-release=${__data.fields.version}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "API equiv."
                },
                "properties": [
                  {
                    "id": "unit",
