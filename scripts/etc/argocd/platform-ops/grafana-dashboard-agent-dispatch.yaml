          "id": 47,
          "type": "table",
          "title": "Per run evidence",
          "description": "Capped table of task/run number, outcome, test result, log path and known token increment (Codex or agy). Token values are absent when the cumulative counter baseline is unknown or reset.",
          "gridPos": {
            "h": 10,
            "w": 18,
            "x": 6,
            "y": 39
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (version, slug, run, outcome, evidence, evidence_summary, evidence_path, doc) (label_replace(label_replace(label_join(k3dm_dispatch_task_run_outcome{window=\"$window\"}, \"doc\", \"-\", \"version\", \"slug\"), \"doc\", \"plans/$1\", \"doc\", \"(v.*)\"), \"doc\", \"bugs/$1\", \"slug\", \"([0-9]{4}-[0-9]{2}-[0-9]{2}-.*)\"))",
              "instant": true,
              "format": "table",
              "refId": "A"
            },
            {
              "expr": "sum by (version, slug, run, doc) (label_replace(label_replace(label_join(k3dm_dispatch_task_run_agent_tokens{window=\"$window\"}, \"doc\", \"-\", \"version\", \"slug\"), \"doc\", \"plans/$1\", \"doc\", \"(v.*)\"), \"doc\", \"bugs/$1\", \"slug\", \"([0-9]{4}-[0-9]{2}-[0-9]{2}-.*)\"))",
              "instant": true,
              "format": "table",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "slug"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open spec",
                        "targetBlank": true,
                        "url": "https://github.com/wilddog64/k3d-manager/blob/k3d-manager-${__data.fields.version}/docs/${__data.fields.doc}.md"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Log"
                },
                "properties": [
                  {"id": "custom.width", "value": 150},
                  {"id": "custom.inspect", "value": true},
                  {"id": "links", "value": [{"title": "Open log", "url": "/d/k3dm-agent-run-log?var-version=${__data.fields.version}&var-slug=${__data.fields.slug}&var-run=${__data.fields.run}&from=now-30d&to=now"}]}
                ]
              },
              {"matcher": {"id": "byName", "options": "version"}, "properties": [{"id": "custom.width", "value": 70}]},
              {"matcher": {"id": "byName", "options": "run"}, "properties": [{"id": "custom.width", "value": 45}]},
              {"matcher": {"id": "byName", "options": "outcome"}, "properties": [{"id": "custom.width", "value": 85}]},
              {"matcher": {"id": "byName", "options": "Result"}, "properties": [{"id": "custom.width", "value": 165}]},
              {"matcher": {"id": "byName", "options": "Tokens"}, "properties": [{"id": "custom.width", "value": 75}]}
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "slug",
                "desc": false
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "window": true,
                  "doc": true,
                  "evidence": true,
                  "Value #A": true
                },
                "indexByName": {
                  "version": 0,
                  "slug": 1,
                  "run": 2,
                  "outcome": 3,
                  "evidence_summary": 4,
                  "evidence_path": 5,
                  "Value #B": 6
                },
                "renameByName": {
                  "evidence_summary": "Result",
                  "evidence_path": "Log",
                  "Value #B": "Tokens"
                }
              }
            }
          ]
