apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-dispatch
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-dispatch.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Dispatch",
      "uid": "k3dm-agent-dispatch",
      "description": "Codex dispatch throughput, landing outcomes, intervention and agent efficiency.",
      "tags": ["k3d-manager", "codex", "dispatch"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-30d", "to": "now"},
      "templating": {"list": [{
        "name": "window", "label": "Window", "type": "custom",
        "query": "1d,7d,30d", "options": [
          {"text": "1d", "value": "1d", "selected": false},
          {"text": "7d", "value": "7d", "selected": true},
          {"text": "30d", "value": "30d", "selected": false}
        ], "current": {"text": "7d", "value": "7d", "selected": true}
      }]},
      "panels": [
        {"id": 1, "type": "stat", "title": "Accepted specs", "description": "Landed tasks in the selected window.", "gridPos": {"h": 6, "w": 5, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 2, "type": "stat", "title": "Landing success", "description": "Integration-test success: scope and rebase refusals are not counted because they are not integration results.", "gridPos": {"h": 6, "w": 5, "x": 5, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_land_attempts{window=\"$window\",result=\"landed\"} / sum(k3dm_dispatch_land_attempts{window=\"$window\",result=~\"landed|tests\"})", "instant": true}], "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 0.8}]}}, "overrides": []}},
        {"id": 3, "type": "stat", "title": "Claude lines changed per task", "description": "Added plus deleted lines between Codex's finished tree and what landed; this measures intervention, not active time.", "gridPos": {"h": 6, "w": 5, "x": 10, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_verifier_lines_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 4, "type": "stat", "title": "Wait minutes per task", "description": "Wall-clock waiting time from Codex exit to land, not Claude's active minutes.", "gridPos": {"h": 6, "w": 5, "x": 15, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_wait_minutes_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "minutes"}, "overrides": []}},
        {"id": 5, "type": "stat", "title": "Codex tokens per accepted spec", "description": "Codex tokens only; Claude's verification tokens are not recorded per task and tokens are not converted to dollars because price per token is not stable.", "gridPos": {"h": 6, "w": 5, "x": 0, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_codex_tokens_per_landed{window=\"$window\"}", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 6, "type": "stat", "title": "Running", "description": "Started tasks with no Codex exit, land, or abandon event.", "gridPos": {"h": 6, "w": 5, "x": 5, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_running", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 7, "type": "stat", "title": "Awaiting land", "description": "Tasks with a Codex exit and no land or abandon event.", "gridPos": {"h": 6, "w": 5, "x": 10, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_awaiting_land", "instant": true}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 8, "type": "bargauge", "title": "Land outcomes", "description": "Land outcomes by result in the selected window.", "gridPos": {"h": 6, "w": 5, "x": 15, "y": 6}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "k3dm_dispatch_land_attempts{window=\"$window\"}", "legendFormat": "{{result}}"}], "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}},
        {"id": 9, "type": "stat", "title": "Export age", "description": "Age of the dispatch ledger export; yellow above one day.", "gridPos": {"h": 6, "w": 5, "x": 0, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "time() - k3dm_dispatch_ledger_timestamp_seconds", "instant": true}], "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "yellow", "value": 86400}]}}, "overrides": []}}
      ]
    }
