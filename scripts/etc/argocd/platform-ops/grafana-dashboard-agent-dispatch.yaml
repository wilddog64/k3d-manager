apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-dispatch
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-dispatch.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Agent Dispatch",
      "uid": "k3dm-agent-dispatch",
      "description": "Codex dispatch throughput, landing outcomes, intervention and agent efficiency across the selected window or release. Release scope covers v1.43.0 onward; earlier releases were dispatched before the ledger existed.",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "k3dm-agents"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "title": "Agents"
        },
        {
          "type": "link",
          "title": "Bug Tracking",
          "url": "/d/k3dm-bugs"
        }
      ],
      "tags": [
        "k3d-manager",
        "k3dm-agents"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "window",
            "label": "Window",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(k3dm_dispatch_landed, window)",
              "refId": "window"
            },
            "definition": "label_values(k3dm_dispatch_landed, window)",
            "refresh": 2,
            "sort": 7,
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "7d",
              "value": "7d",
              "selected": true
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Accepted specs",
          "description": "Landed tasks in the selected window.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Landing success",
          "description": "Integration-test success: scope and rebase refusals are not counted because they are not integration results.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 5,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(k3dm_dispatch_land_attempts{window=\"$window\",result=\"landed\"}) / sum(k3dm_dispatch_land_attempts{window=\"$window\",result=~\"landed|tests\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 0.8
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Claude lines changed per task",
          "description": "Added plus deleted lines between Codex's finished tree and what landed; this measures intervention, not active time.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 10,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_verifier_lines_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Wait minutes per task",
          "description": "Wall-clock waiting time from Codex exit to land, not Claude's active minutes.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 15,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_wait_minutes_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "minutes",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Codex tokens / spec",
          "description": "Codex tokens only; Claude verification tokens are not recorded per task. See Cost (API-equivalent) for dollars. A mean; one long spec can dominate it — see Per spec.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_codex_tokens_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Running",
          "description": "Started tasks with no Codex exit, land, or abandon event. (not release-scoped)",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 5,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_running",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Awaiting land",
          "description": "Tasks with a Codex exit and no land or abandon event. (not release-scoped)",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 10,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_awaiting_land",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Land outcomes",
          "description": "Land outcomes by result in the selected window.",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 15,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_land_attempts{window=\"$window\"}",
              "legendFormat": "{{result}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "landed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "rebase"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "scope"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "tests"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "displayMode": "basic"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Time to land",
          "description": "Mean wall-clock time from a spec's first Codex start to its land, including Claude's verification.",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_elapsed_minutes_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Codex time",
          "description": "Mean time Codex itself ran per spec, summed over its runs.",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 20,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_codex_minutes_per_landed{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Per spec",
          "description": "Each landed spec in the selected window or release, newest 50. Release scope covers v1.43.0 onward; earlier releases were dispatched before the ledger existed. Tokens, Agent time and Runs cover every agent (Codex and agy); a Codex spec's Tokens are the session total of its last run, an agy spec's the sum of its runs' reported usage. API equiv. stays Codex-only: there is no agy pricing. Only specs dispatched with `bin/k3dm-codex-dispatch` appear; a bare `codex exec` writes no ledger event. The footer totals Tokens, Agent time, Runs and API equiv. over the rows shown; Time to land is not totalled, because its mean is the Time to land stat above.",
          "gridPos": {
            "h": 10,
            "w": 19,
            "x": 5,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (version, slug) (k3dm_dispatch_task_agent_tokens{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "sum by (version, slug) (k3dm_dispatch_task_agent_seconds{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "sum by (version, slug) (k3dm_dispatch_task_elapsed_seconds{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "C"
            },
            {
              "expr": "sum by (version, slug) (k3dm_dispatch_task_agent_runs{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "D"
            },
            {
              "expr": "max by (version, slug, spec, agent) (k3dm_dispatch_task_spec{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "E"
            },
            {
              "expr": "sum by (version, slug) (k3dm_dispatch_task_api_cost_usd{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "F"
            },
            {
              "expr": "sum by (version, slug) (k3dm_dispatch_task_claude_api_cost_usd{window=\"$window\"})",
              "format": "table",
              "instant": true,
              "refId": "G"
            }
          ],
          "transformations": [
            {
              "id": "merge"
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #E": true
                },
                "indexByName": {
                  "version": 0,
                  "slug": 1,
                  "agent": 2,
                  "Value #A": 3,
                  "Value #B": 4,
                  "Value #C": 5,
                  "Value #D": 6,
                  "Value #F": 7,
                  "Value #G": 8,
                  "spec": 9
                },
                "renameByName": {
                  "version": "Release",
                  "slug": "Spec",
                  "agent": "Agent",
                  "Value #A": "Tokens",
                  "Value #B": "Agent time",
                  "Value #C": "Time to land",
                  "Value #D": "Runs",
                  "Value #F": "API equiv.",
                  "Value #G": "Claude ≈"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Tokens"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Agent time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time to land"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Release"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open this release in Bug Tracking",
                        "url": "/d/k3dm-bugs?var-release=${__data.fields.version}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "API equiv."
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyUSD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Claude ≈"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyUSD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "description",
                    "value": "Claude usage between dispatch and land, split across tasks that overlap. Excludes spec writing before dispatch. Time overlap, not measured spend: Claude work on something else in that time is included."
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "spec"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Spec"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open spec document",
                        "url": "https://github.com/wilddog64/k3d-manager/blob/k3d-manager-${__data.fields.version}/${__data.fields.spec}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "sortBy": [
              {
                "displayName": "Tokens",
                "desc": true
              }
            ],
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "countRows": false,
              "fields": [
                "Value #A",
                "Value #B",
                "Value #D",
                "Value #F",
                "Value #G",
                "Tokens",
                "Agent time",
                "Runs",
                "API equiv.",
                "Claude ≈"
              ]
            }
          }
        },
        {
          "id": 9,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Last update",
          "description": "Time since bin/k3dm-dispatch-metrics last published the ledger. It runs after every bin/k3dm-codex-dispatch event (start, exit, land, resume, abandon) or make dispatch-metrics, so a large value means no wrapped dispatch since, not a broken exporter. Yellow above one day. (not release-scoped)",
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "time() - k3dm_dispatch_ledger_timestamp_seconds",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "yellow",
                    "value": 86400
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Rework rate",
          "description": "Share of landed specs that needed a second pass: Codex ran more than once, the integration gate refused it for tests, Claude changed lines before landing, or the independent verifier failed. Rebase and scope refusals are not rework. Split by cause, including review: k3dm_dispatch_rework_landed.",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_rework_ratio{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 40,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Codex tokens per verified spec",
          "description": "Mean implementation Codex tokens plus any Codex-run verifier tokens for delivered specs in the selected window or release. Claude verification tokens are excluded. No data means no delivered spec has a token total.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_codex_tokens_per_delivered{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 41,
          "type": "stat",
          "options": {
            "text": {
              "valueSize": 32
            }
          },
          "title": "Awaiting verification",
          "description": "Landed specs with a missing or failed latest independent verification, or with required live evidence still missing. Specs whose source document is absent are shown separately as unknown.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "k3dm_dispatch_awaiting_verification{window=\"$window\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
