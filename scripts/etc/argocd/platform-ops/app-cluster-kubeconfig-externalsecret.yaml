apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-cluster-kubeconfig
  namespace: platform-ops
  labels:
    app.kubernetes.io/part-of: k3d-manager-platform-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app-cluster-kubeconfig
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      stringData:
        server: "{{ .server }}"
        config: '{{ dict "bearerToken" .bearerToken "tlsClientConfig" (dict "caData" .caData) | toJson }}'
  data:
    - secretKey: server
      remoteRef:
        key: platform-ops/app-cluster-hostinger
        property: server
    - secretKey: caData
      remoteRef:
        key: platform-ops/app-cluster-hostinger
        property: caData
    - secretKey: bearerToken
      remoteRef:
        key: platform-ops/app-cluster-hostinger
        property: bearerToken
