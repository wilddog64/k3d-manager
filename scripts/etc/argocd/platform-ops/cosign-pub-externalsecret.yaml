apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign-public-key
  namespace: platform-ops
  labels:
    app.kubernetes.io/part-of: k3d-manager-signing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cosign-public-key
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: cosign.pub
      remoteRef:
        key: cosign/signing
        property: cosign.pub
