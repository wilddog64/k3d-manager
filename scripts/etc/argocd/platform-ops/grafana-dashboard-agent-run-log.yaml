apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-run-log
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  agent-run-log.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "title": "k3dm Agent Run Log",
      "uid": "k3dm-agent-run-log",
      "description": "Run evidence availability and redacted land-test.log output. The selected Result appears in the log heading; codex.log is never shipped.",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "k3dm-agents"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "title": "Agents"
        }
      ],
      "tags": [
        "k3d-manager",
        "k3dm-agents"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "version",
            "label": "Version",
            "type": "textbox",
            "query": "v1.43.7",
            "current": {
              "text": "v1.43.7",
              "value": "v1.43.7"
            },
            "options": [
              {
                "selected": true,
                "text": "v1.43.7",
                "value": "v1.43.7"
              }
            ],
            "hide": 0
          },
          {
            "name": "slug",
            "label": "Slug",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ],
            "hide": 0
          },
          {
            "name": "run",
            "label": "Run",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": [
              {
                "selected": true,
                "text": "",
                "value": ""
              }
            ],
            "hide": 0
          },
          {
            "name": "result",
            "type": "textbox",
            "query": "Evidence availability unknown",
            "current": {
              "text": "Evidence availability unknown",
              "value": "Evidence availability unknown"
            },
            "options": [
              {
                "selected": true,
                "text": "Evidence availability unknown",
                "value": "Evidence availability unknown"
              }
            ],
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Run log — ${result}",
          "gridPos": {
            "h": 20,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{job=\"k3dm-dispatch-run\", version=\"$version\", slug=\"$slug\", run=\"$run\"}",
              "refId": "A",
              "queryType": "range",
              "maxLines": 5000
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Ascending",
            "wrapLogMessage": true
          },
          "description": "The heading shows the selected Result. If it says local only (not shipped), no startup transcript is available in Loki: codex.log stays on the dispatch host. Shipped landing-test output appears below. Missing output may also mean it was not shipped or is outside the selected time range; it is not proof of success."
        }
      ]
    }
