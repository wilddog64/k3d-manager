apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pr-checks
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  pr-checks.json: |
    {
      "title":"k3dm PR Checks","uid":"k3dm-pr-checks","tags":["k3dm","ci"],"schemaVersion":39,"version":1,"refresh":"1m","time":{"from":"now-24h","to":"now"},
      "templating":{"list":[{"name":"repo","type":"query","query":"label_values(k3dm_pr_checks_open_prs, repo)","definition":"label_values(k3dm_pr_checks_open_prs, repo)","multi":true,"includeAll":true,"allValue":".*","current":{"text":"All","value":["$__all"]}}]},
      "panels":[
        {"id":1,"type":"stat","title":"Open PRs","gridPos":{"h":4,"w":6,"x":0,"y":0},"targets":[{"expr":"sum(k3dm_pr_checks_open_prs{repo=~\"$repo\"}) or vector(0)"}]},
        {"id":2,"type":"stat","title":"Failing","gridPos":{"h":4,"w":6,"x":6,"y":0},"fieldConfig":{"defaults":{"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}},"overrides":[]},"targets":[{"expr":"count(k3dm_pr_overall{repo=~\"$repo\",state=\"failure\"}) or vector(0)"}]},
        {"id":3,"type":"stat","title":"Running","gridPos":{"h":4,"w":6,"x":12,"y":0},"targets":[{"expr":"count(k3dm_pr_overall{repo=~\"$repo\",state=\"running\"}) or vector(0)"}]},
        {"id":4,"type":"stat","title":"Last scrape","gridPos":{"h":4,"w":6,"x":18,"y":0},"fieldConfig":{"defaults":{"unit":"s","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":900},{"color":"red","value":1800}]}},"overrides":[]},"targets":[{"expr":"time() - max(k3dm_pr_checks_last_scrape_timestamp_seconds{repo=~\"$repo\"})"}]},
        {"id":5,"type":"table","title":"Open PRs","gridPos":{"h":8,"w":24,"x":0,"y":4},"targets":[{"refId":"A","expr":"label_join(k3dm_pr_info{repo=~\"$repo\"},\"__join\",\":\",\"repo\",\"pr\")","instant":true,"format":"table"},{"refId":"B","expr":"max by (__join, state) (label_join(k3dm_pr_overall{repo=~\"$repo\"},\"__join\",\":\",\"repo\",\"pr\"))","instant":true,"format":"table"}],"transformations":[{"id":"joinByField","options":{"byField":"__join","mode":"outer"}},{"id":"organize","options":{"renameByName":{"repo":"Repo","pr":"PR","title":"Title","head":"Head","draft":"Draft","state":"Overall"},"excludeByName":{"Time":true,"Value":true,"Value #A":true,"Value #B":true,"__name__":true,"__join":true,"job":true,"instance":true},"sortBy":[{"displayName":"Repo","desc":false},{"displayName":"PR","desc":true}]}}],"fieldConfig":{"defaults":{"noValue":"No open PRs","custom":{"cellOptions":{"type":"color-text"}},"mappings":[{"type":"value","options":{"success":{"color":"green"},"failure":{"color":"red"},"running":{"color":"blue"},"none":{"color":"gray"}}}]},"overrides":[]}},
        {"id":6,"type":"table","title":"Checks per PR","gridPos":{"h":10,"w":24,"x":0,"y":12},"targets":[{"refId":"A","expr":"label_join(k3dm_pr_check_state{repo=~\"$repo\"},\"__join\",\":\",\"repo\",\"pr\",\"check\")","instant":true,"format":"table"},{"refId":"B","expr":"max by (__join) (label_join(k3dm_pr_check_duration_seconds{repo=~\"$repo\"},\"__join\",\":\",\"repo\",\"pr\",\"check\"))","instant":true,"format":"table"}],"transformations":[{"id":"joinByField","options":{"byField":"__join","mode":"outer"}},{"id":"organize","options":{"renameByName":{"repo":"Repo","pr":"PR","check":"Check","state":"State","Value #B":"Duration"},"excludeByName":{"Time":true,"Value":true,"Value #A":true,"__name__":true,"__join":true,"job":true,"instance":true},"sortBy":[{"displayName":"Repo","desc":false},{"displayName":"PR","desc":true},{"displayName":"Check","desc":false}]}}],"fieldConfig":{"defaults":{"noValue":"No open PRs — no checks to show","custom":{"cellOptions":{"type":"color-text"}},"mappings":[{"type":"value","options":{"success":{"color":"green"},"failure":{"color":"red"},"timed_out":{"color":"red"},"action_required":{"color":"red"},"startup_failure":{"color":"red"},"stale":{"color":"red"},"queued":{"color":"blue"},"in_progress":{"color":"blue"},"waiting":{"color":"blue"},"requested":{"color":"blue"},"pending":{"color":"blue"},"cancelled":{"color":"gray"},"skipped":{"color":"gray"},"neutral":{"color":"gray"}}}]},"overrides":[{"matcher":{"id":"byName","options":"Duration"},"properties":[{"id":"unit","value":"s"}]}]}},
        {"id":7,"type":"stat","title":"GitHub read","gridPos":{"h":4,"w":6,"x":18,"y":22},"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"1":{"text":"ok","color":"green"},"0":{"text":"failed","color":"red"}}}]},"overrides":[]},"targets":[{"expr":"min(k3dm_pr_checks_scrape_success{repo=~\"$repo\"})"}]},
        {"id":8,"type":"timeseries","title":"Check duration","gridPos":{"h":8,"w":18,"x":0,"y":22},"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"targets":[{"expr":"k3dm_pr_check_duration_seconds{repo=~\"$repo\"}","legendFormat":"{{repo}}#{{pr}} {{check}}"}]}
      ]
    }
