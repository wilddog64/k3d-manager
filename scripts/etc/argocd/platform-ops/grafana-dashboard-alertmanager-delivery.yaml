apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alertmanager-delivery
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  alertmanager-delivery.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Alertmanager Delivery",
      "uid": "k3dm-alertmanager-delivery",
      "description": "Alertmanager delivery for the integrations this stack actually uses. Replaces the chart's Alertmanager / Overview, which draws a panel for every integration Alertmanager supports.",
      "tags": [
        "alertmanager",
        "k3d-manager",
        "notifications"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "integration",
            "label": "Integration",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "query_result(sum by (integration) (max_over_time(alertmanager_notifications_total{namespace=\"monitoring\"}[30d])) > 0)",
              "refId": "integration"
            },
            "regex": "/integration=\"([^\"]+)\"/",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Delivery (integrations that have actually sent in the last 30 days)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Notifications sent (24h)",
          "description": "Successful + failed attempts per integration over the last 24 h. Only integrations in use are listed.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (integration) (increase(alertmanager_notifications_total{namespace=\"monitoring\",integration=~\"$integration\"}[24h]))",
              "legendFormat": "{{integration}}",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failed notifications (24h)",
          "description": "Delivery failures per integration over the last 24 h. Any value above 0 means an alert may not have reached you.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (integration) (increase(alertmanager_notifications_failed_total{namespace=\"monitoring\",integration=~\"$integration\"}[24h]))",
              "legendFormat": "{{integration}}",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Actionable alerts by severity",
          "description": "Routing: severity=critical goes to the SMS gateway (sms-critical), severity=warning goes to Gmail (platform-warning). Many warnings and no critical alerts means email but no texts, by design. Hermes's own SMS pager sends from the M4 through Gmail SMTP and does not appear here. Trivy findings and synthetic test alerts are counted in their own panels below.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (severity) (ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor|Trivy.*\",job!~\".*smstest.*\"})",
              "legendFormat": "{{severity}}",
              "instant": true
            }
          ]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Alerting pipeline",
          "description": "These are the kube-prometheus-stack rules that watch the alerting system itself (send failures, Prometheus not connected to Alertmanager, rule evaluation falling behind). 0 means none firing. Look at the alert names in Prometheus when this is red.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",alertname=~\"Alertmanager.*|PrometheusNotConnectedToAlertmanagers|PrometheusErrorSendingAlerts.*|PrometheusNotificationQueueRunningFull|PrometheusRuleFailures|PrometheusMissingRuleEvaluations\"}) or vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Actionable alerts",
          "description": "Alerts firing now, excluding Trivy findings and synthetic tests.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "severity",
                "desc": false
              }
            ],
            "footer": {
              "show": true,
              "reducer": [
                "count"
              ],
              "fields": [
                "alertname"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor|Trivy.*\",job!~\".*smstest.*\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "alertstate": true
                },
                "indexByName": {
                  "severity": 0,
                  "alertname": 1,
                  "cluster": 2,
                  "namespace": 3,
                  "image_repository": 4,
                  "tier": 5,
                  "remediation": 6
                },
                "renameByName": {}
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "table",
          "title": "Security findings by image",
          "description": "One row per image. tier=\"upstream\" is a third-party image we only consume; anything else is ours and has a remediation path through the CVE loop. This is a backlog, not a page.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "tier",
                "desc": false
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (tier, image_repository, alertname) (ALERTS{alertstate=\"firing\",alertname=~\"Trivy.*\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "tier": 0,
                  "image_repository": 1,
                  "alertname": 2,
                  "Value": 3
                },
                "renameByName": {
                  "Value": "findings"
                }
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Synthetic / test alerts",
          "description": "Deliberate test alerts (for example the k3dm-disk-smstest Pushgateway job used to check SMS delivery). They route like real alerts, so they do send texts. Delete the test job when the test is over.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\",job=~\".*smstest.*\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "alertstate": true
                },
                "indexByName": {
                  "severity": 0,
                  "alertname": 1,
                  "cluster": 2,
                  "namespace": 3,
                  "image_repository": 4,
                  "tier": 5,
                  "remediation": 6
                },
                "renameByName": {}
              }
            }
          ]
        },
        {
          "id": 12,
          "type": "table",
          "title": "Noisiest alerts (3d)",
          "description": "Hub Prometheus keeps 3 days (retention: 3d). firing series-hours is time spent firing, summed over series, assuming the 60s rule evaluation interval. trips counts how many times an alert started pending, including ones that cleared before firing. A high count with no firing hours is flapping. Alertmanager does not label notification counts or latency by alert name, so this panel cannot show notifications per alert.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "firing series-hours",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (alertname) (count_over_time(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}[3d])) / 60",
              "format": "table",
              "instant": true,
              "refId": "A",
              "legendFormat": "firing series-hours"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (alertname) (changes(ALERTS_FOR_STATE{alertname!~\"Watchdog|InfoInhibitor\"}[3d]))",
              "format": "table",
              "instant": true,
              "refId": "B",
              "legendFormat": "trips (pending or firing)"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "firing series-hours",
                  "Value #B": "trips (pending or firing)"
                }
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "Per integration: $integration",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "panels": [],
          "repeat": "integration"
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "$integration: send rate",
          "description": "Notifications attempted and failed per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 33
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(alertmanager_notifications_total{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval]))",
              "legendFormat": "sent",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(rate(alertmanager_notifications_failed_total{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval]))",
              "legendFormat": "failed",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "$integration: delivery latency",
          "description": "p50 and p99 time to deliver one notification.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 33
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(alertmanager_notification_latency_seconds_bucket{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(alertmanager_notification_latency_seconds_bucket{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
