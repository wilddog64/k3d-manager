apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alertmanager-delivery
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  alertmanager-delivery.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "title": "k3dm Alertmanager Delivery",
      "uid": "k3dm-alertmanager-delivery",
      "description": "Alertmanager delivery for the integrations this stack actually uses. Replaces the chart's Alertmanager / Overview, which draws a panel for every integration Alertmanager supports.",
      "tags": [
        "alertmanager",
        "k3d-manager",
        "notifications"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "integration",
            "label": "Integration",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "query_result(sum by (integration) (max_over_time(alertmanager_notifications_total{namespace=\"monitoring\"}[30d])) > 0)",
              "refId": "integration"
            },
            "regex": "/integration=\"([^\"]+)\"/",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Delivery (integrations that have actually sent in the last 30 days)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Notifications sent (24h)",
          "description": "Successful + failed attempts per integration over the last 24 h. Only integrations in use are listed.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (integration) (increase(alertmanager_notifications_total{namespace=\"monitoring\",integration=~\"$integration\"}[24h]))",
              "legendFormat": "{{integration}}",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Failed notifications (24h)",
          "description": "Delivery failures per integration over the last 24 h. Any value above 0 means an alert may not have reached you.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (integration) (increase(alertmanager_notifications_failed_total{namespace=\"monitoring\",integration=~\"$integration\"}[24h]))",
              "legendFormat": "{{integration}}",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Firing alerts by severity",
          "description": "Routing: severity=critical goes to the SMS gateway (sms-critical), severity=warning goes to Gmail (platform-warning). Many warnings and no critical alerts means email but no texts, by design. Hermes's own SMS pager sends from the M4 through Gmail SMTP and does not appear here.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (severity) (ALERTS{alertstate=\"firing\",alertname!=\"Watchdog\"})",
              "legendFormat": "{{severity}}",
              "instant": true
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Firing alerts",
          "description": "Every alert firing now (Watchdog excluded), one row per alert. Severity decides routing: critical goes to SMS, warning to email.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "severity",
                "desc": false
              }
            ],
            "footer": {
              "show": true,
              "reducer": [
                "count"
              ],
              "fields": [
                "alertname"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",alertname!=\"Watchdog\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "alertstate": true
                },
                "indexByName": {
                  "severity": 0,
                  "alertname": 1,
                  "cluster": 2,
                  "namespace": 3,
                  "image_repository": 4,
                  "tier": 5,
                  "remediation": 6
                },
                "renameByName": {}
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "Per integration: $integration",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "panels": [],
          "repeat": "integration"
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "$integration: send rate",
          "description": "Notifications attempted and failed per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(alertmanager_notifications_total{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval]))",
              "legendFormat": "sent",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "sum(rate(alertmanager_notifications_failed_total{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval]))",
              "legendFormat": "failed",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "$integration: delivery latency",
          "description": "p50 and p99 time to deliver one notification.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(alertmanager_notification_latency_seconds_bucket{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(alertmanager_notification_latency_seconds_bucket{namespace=\"monitoring\",integration=\"$integration\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
