apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-dashboards-acg
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    managed-by: k3d-manager
    app-type: observability
    k3dm.k3d.io/rollout-stage: app-cluster
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            k3d-manager/role: app-cluster
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: '{{.name}}-grafana-dashboards'
      labels:
        app-type: observability
    spec:
      project: platform
      destination:
        name: '{{.name}}'
        namespace: monitoring
      source:
        repoURL: https://github.com/wilddog64/k3d-manager
        targetRevision: '${K3D_MANAGER_BRANCH}'
        path: scripts/etc/grafana/dashboards
        directory:
          recurse: false
          exclude: '{k3dm-tests-configmap.yaml,{{if eq .server "https://kubernetes.default.svc"}}grafana-overview-readable-configmap.yaml{{end}}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
