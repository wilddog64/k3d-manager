apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vectordb
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    managed-by: k3d-manager
    app-type: platform
spec:
  generators:
    - list:
        elements:
          - name: hub
  goTemplate: true
  template:
    metadata:
      name: '{{.name}}-vectordb'
      labels:
        app-type: platform
    spec:
      project: platform
      destination:
        server: https://kubernetes.default.svc
        namespace: vectordb
      source:
        repoURL: https://github.com/wilddog64/k3d-manager
        targetRevision: '${K3D_MANAGER_BRANCH}'
        path: scripts/etc/argocd/vectordb
        directory: {}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
