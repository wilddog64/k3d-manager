apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-git
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    managed-by: k3d-manager
    app-type: services
    k3dm.k3d.io/rollout-stage: app-cluster
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  k3d-manager/role: app-cluster
                  k3d-manager/shopping-cart: "true"
          - matrix:
              generators:
                - git:
                    repoURL: https://github.com/wilddog64/k3d-manager
                    revision: '${K3D_MANAGER_BRANCH}'
                    directories:
                      - path: services/*
                      - path: services/shopping-cart-identity
                        exclude: true
                - git:
                    repoURL: https://github.com/wilddog64/k3d-manager
                    revision: cve-pins/hub
                    pathParamPrefix: cvePinsFile
                    files:
                      - path: pins.json
                  selector:
                    matchExpressions:
                      - {key: name, operator: DoesNotExist}
                      - {key: nameNormalized, operator: DoesNotExist}
                      - {key: server, operator: DoesNotExist}
                      - {key: project, operator: DoesNotExist}
                      - {key: path.path, operator: DoesNotExist}
                      - {key: path.basename, operator: DoesNotExist}
                      - {key: metadata.labels.k3dm.k3d.io/e2e-profile, operator: DoesNotExist}
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{.name}}-{{.path.basename}}'
      labels:
        app-type: service
        discovered-from: git
    spec:
      project: shopping-cart
      destination:
        name: '{{.name}}'
        namespace: shopping-cart-apps
      source:
        repoURL: https://github.com/wilddog64/k3d-manager
        targetRevision: '${K3D_MANAGER_BRANCH}'
        path: '{{ if and (eq (index .metadata.labels "k3dm.k3d.io/e2e-profile") "stripe") (has .path.basename (list "shopping-cart-order" "shopping-cart-payment")) }}services-e2e-stripe/{{.path.basename}}{{ else }}{{.path.path}}{{ end }}'
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: payment-db-credentials
          namespace: shopping-cart-payment
          jsonPointers:
            - /data/username
            - /data/password
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.refreshInterval
        - group: ""
          kind: Secret
          name: order-service-secrets
          namespace: shopping-cart-apps
          jsonPointers:
            - /data
            - /metadata/labels
            - /metadata/ownerReferences
        - group: ""
          kind: ConfigMap
          name: product-catalog-seed-script
          namespace: shopping-cart-apps
          jsonPointers:
            - /data
            - /metadata/labels
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- $pins := index . "cvePins" }}
    {{- if kindIs "map" $pins }}
    {{- $pin := index $pins .path.basename }}
    {{- if kindIs "map" $pin }}
    {{- if regexMatch "^sha256:[0-9a-f]{64}$" (toString (index $pin "digest")) }}
    spec:
      source:
        kustomize:
          images:
            - 'ghcr.io/wilddog64/{{ .path.basename }}@{{ index $pin "digest" }}'
    {{- end }}
    {{- end }}
    {{- end -}}
