apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-ambient
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    managed-by: k3d-manager
    app-type: mesh
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: istio-base
            chart: base
            wave: "0"
            values: |
              defaultRevision: default
          - name: istiod
            chart: istiod
            wave: "1"
            values: |
              profile: ambient
              pilot:
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
          - name: istio-cni
            chart: cni
            wave: "2"
            values: |
              profile: ambient
              cni:
                cniConfDir: ${AMBIENT_CNI_CONF_DIR}
                cniBinDir: ${AMBIENT_CNI_BIN_DIR}
          - name: ztunnel
            chart: ztunnel
            wave: "3"
            values: |
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
  template:
    metadata:
      name: '{{ .name }}-${APP_CLUSTER_NAME}'
      namespace: ${ARGOCD_NAMESPACE}
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
        # ServerSideApply otherwise selects ArgoCD's structured-merge diff,
        # which retains Kubernetes default-value false drift for Istio's
        # DaemonSet and Deployment manifests.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
      labels:
        managed-by: k3d-manager
        app-type: mesh
    spec:
      project: platform
      # Istiod changes these bootstrap values once its validation endpoints are
      # ready.  They are controller-owned runtime state, not Git drift.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
          jsonPointers:
            - /webhooks/0/clientConfig/caBundle
            - /webhooks/0/failurePolicy
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system
          jsonPointers:
            - /webhooks/0/clientConfig/caBundle
            - /webhooks/0/failurePolicy
      destination:
        name: ${APP_CLUSTER_NAME}
        namespace: istio-system
      source:
        repoURL: https://istio-release.storage.googleapis.com/charts
        chart: '{{ .chart }}'
        targetRevision: ${AMBIENT_ISTIO_VERSION}
        helm:
          releaseName: '{{ .name }}'
          values: '{{ .values }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
