apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-acg
  namespace: ${ARGOCD_NAMESPACE}
  labels:
    managed-by: k3d-manager
    app-type: observability
    k3dm.k3d.io/rollout-stage: app-cluster
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  k3d-manager/role: app-cluster
                matchExpressions:
                  - key: k3d-manager/provider
                    operator: In
                    values:
                      - k3s-hostinger
                      - k3s-aws
          - list:
              elements:
                - app: acg-kube-prometheus-stack
                  namespace: monitoring
                  chart: kube-prometheus-stack
                  repoURL: https://prometheus-community.github.io/helm-charts
                  targetRevision: 67.9.0
                  valuesFile: scripts/etc/helm/observability/kube-prometheus-stack-acg-values.yaml
                - app: loki
                  namespace: monitoring
                  chart: loki
                  repoURL: https://grafana-community.github.io/helm-charts
                  targetRevision: 18.2.0
                  valuesFile: scripts/etc/helm/observability/loki-values.yaml
                - app: acg-trivy-operator
                  namespace: trivy-system
                  chart: trivy-operator
                  repoURL: https://aquasecurity.github.io/helm-charts
                  targetRevision: 0.34.0
                  valuesFile: scripts/etc/helm/observability/trivy-operator-acg-values.yaml
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: '{{.name}}-{{.app}}'
    spec:
      project: platform
      destination:
        name: '{{.name}}'
        namespace: '{{.namespace}}'
      sources:
        - repoURL: https://github.com/wilddog64/k3d-manager
          targetRevision: '${K3D_MANAGER_BRANCH}'
          ref: values
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{.targetRevision}}'
          helm:
            releaseName: '{{.app}}'
            valueFiles:
              - '$values/{{.valuesFile}}'
            parameters:
              - name: prometheus.prometheusSpec.externalLabels.cluster
                value: '{{.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
