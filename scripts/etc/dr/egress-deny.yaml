# Drill pods may reach DNS and each other (ESO -> Vault, Keycloak -> Postgres and LDAP), nothing
# else. bin/hub-up adds the drill API server as a /32; check V0 proves the internet is blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dr-default-deny-egress
  namespace: secrets
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: secrets}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: identity}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dr-default-deny-egress
  namespace: identity
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: secrets}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: identity}
