# Keycloak's postgres for the DR drill only (applied by hub_data_restore).
#
# The hub runs it from shopping-cart-infra identity/keycloak via ArgoCD, with a generated
# ConfigMap and an ExternalSecret password. A drill has neither: it stops before ArgoCD and
# applies no ExternalSecret. The restored data directory is already initialised, so postgres
# starts without a password. Keep the image major version equal to the hub's (postgres.yaml
# in shopping-cart-infra): the data directory only opens with the same major version.
#
# replicas: 0 so nothing writes to the claim before the restore copies the data in; the
# restore scales it to 1 afterwards.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: postgres-keycloak
    app.kubernetes.io/component: database
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-keycloak
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-keycloak-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: postgres-keycloak
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    app.kubernetes.io/name: postgres-keycloak
