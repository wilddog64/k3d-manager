---
name: CI

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alertmanager-behaviour:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pytest and PyYAML
        run: python3 -m pip install --user pytest==9.1.1 PyYAML==6.0.2

      - name: Run Alertmanager behaviour test
        run: make test-alertmanager-behaviour

  lint:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Install Copilot CLI
        if: env.COPILOT_GITHUB_TOKEN != ''
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-delay 5 \
            https://gh.io/copilot-install \
            -o "${tmp_dir}/copilot-install.sh"
          chmod +x "${tmp_dir}/copilot-install.sh"
          env VERSION=latest bash "${tmp_dir}/copilot-install.sh"
          rm -rf "$tmp_dir"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run shellcheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find scripts -type f \( -name '*.sh' -o -name 'k3d-manager' \) \
              -exec awk 'FNR==1 && /^#!.*bash/ {print FILENAME}' {} +
          )
          shellcheck -S error "${files[@]}"

      - name: Run bash syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f \( -name '*.sh' -o -name 'k3d-manager' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done

      - name: Run yamllint on workflow files
        shell: bash
        run: |
          set -euo pipefail
          yamllint .github/workflows/*.yml

      - name: Install promtool
        shell: bash
        run: |
          set -euo pipefail
          version=3.1.0
          sha256="9a9d1e115d1745826b13aec3f1409780"
          sha256+="b9fcf1d4206746cb4faee46ca5add70c"
          tmp_dir="$(mktemp -d)"
          tarball="prometheus-${version}.linux-amd64.tar.gz"
          base=https://github.com/prometheus/prometheus/releases/download
          curl -fsSL --retry 3 --retry-delay 5 \
            "${base}/v${version}/${tarball}" -o "${tmp_dir}/${tarball}"
          echo "${sha256}  ${tmp_dir}/${tarball}" | sha256sum -c -
          tar -xzf "${tmp_dir}/${tarball}" -C "$tmp_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 \
            "${tmp_dir}/prometheus-${version}.linux-amd64/promtool" \
            "$HOME/.local/bin/promtool"
          rm -rf "$tmp_dir"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the full offline suite (BATS + Python)
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          K3DM_ENABLE_AI: "1"
          K3DM_COPILOT_LIVE_TESTS: "1"
        run: |
          set -euo pipefail
          make test
          make test-bin
          make test-python-unit

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pytest==9.1.1 ruff==0.15.8

      - name: Run pytest suites (hermes + bin)
        shell: bash
        run: |
          set -euo pipefail
          make test-pytest

      - name: Lint Python (pyflakes)
        shell: bash
        run: |
          set -euo pipefail
          make lint-python

      - name: Validate manifests (kubeconform)
        shell: bash
        run: |
          set -euo pipefail
          make validate-manifests
